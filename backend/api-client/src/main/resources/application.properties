spring.application.name=api-client
server.port=8081

# BladeBook's one DynamoDB table (ADR-MASTER section 3).
bladebook.table=bladebook

# Every limit is measured from auth_time (ADR-MASTER section 15): 60 minutes on the family website.
bladebook.auth.sign-in-minutes=60

# USA Hockey's season check digit (ADR-029): its place among the number's nine digits (1-9) and the digit
# it must be. Where this lives and who changes it each season is still open (ADR-029 Open), so it's off
# until both are set.
#bladebook.usa-hockey.check-digit-position=
#bladebook.usa-hockey.check-digit=

# On AWS these come from the deployment: the family app client's ID and the user pool's issuer URL.
# Nothing is deployed yet (implementation plan, section 3), so outside the local profile they must be set.
#bladebook.auth.client-app-client-id=
#bladebook.auth.issuer=https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
