# Local profile: DynamoDB Local in Docker (a listed shortcut in README.md), signing in against dev's real user pool (I31).
# Once, signed in to dev's AWS account: npm --prefix infra run dev-pool   (writes ~/.bladebook/dev-pool.properties)
# Run: docker compose up -d   then   ./mvnw -pl api-client -am spring-boot:run -Dspring-boot.run.profiles=local
bladebook.dynamodb.endpoint=http://localhost:8000
# Dev's user pool: its issuer and app client IDs, from the file dev-pool writes. Outside the repo, since a new identity
# stack gives new IDs.
spring.config.import=optional:file:${user.home}/.bladebook/dev-pool.properties
bladebook.auth.client-app-client-id=

# aws-serverless-java-container brings spring-cloud-function-serverless-web, whose auto-configuration
# swaps Tomcat for a Lambda-only server that never listens. Locally we want a real server on :8081.
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration

# Batch 13: the links in emails.
# Each website is its own host on AWS (I14): app.bladebook.org and family.bladebook.org. Locally, one Vite server.
bladebook.coach-site-url=http://localhost:5173/coach
bladebook.family-site-url=http://localhost:5173/family
