# Local profile: DynamoDB Local in Docker and the local token stub (listed as shortcuts in README.md).
# Run: docker compose up -d   then   ./mvnw -pl api-client -am spring-boot:run -Dspring-boot.run.profiles=local
bladebook.dynamodb.endpoint=http://localhost:8000
bladebook.auth.client-app-client-id=local-family-app

# aws-serverless-java-container brings spring-cloud-function-serverless-web, whose auto-configuration
# swaps Tomcat for a Lambda-only server that never listens. Locally we want a real server on :8081.
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration
