# Local profile: DynamoDB Local in Docker and the local token stub (listed as shortcuts in README.md).
# Run: docker compose up -d   then   ./mvnw -pl api-coach -am spring-boot:run -Dspring-boot.run.profiles=local
bladebook.dynamodb.endpoint=http://localhost:8000
bladebook.auth.coach-app-client-id=local-coach-app

# aws-serverless-java-container brings spring-cloud-function-serverless-web, whose auto-configuration
# swaps Tomcat for a Lambda-only server that never listens. Locally we want a real server on :8080.
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration

# Batch 13: the links in emails, and the weekly unpaid threshold (Parameter Store on AWS; blank sends nothing).
bladebook.site-url=http://localhost:5173
bladebook.unpaid-reminder.threshold-days=7
