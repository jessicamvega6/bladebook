<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dana Whitfield · BladeBook coach demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* BladeBook — Harbor theme. Tokens on :root, the shared component layer, and the form-control,
   demo and responsive layers. Taken from design/redesign/harbor-schedule-creator-demo.html
   (2026-10-01), which carries the WCAG-AA-checked Harbor tokens. Wrap pages in
   <div class="bb" data-layout="top">. Harbor is light-only by design. */

/* Layout: Harbor coach app — centred pill nav, page column, sticky action bar.
   Tokens: Harbor theme (teal + coral on sand), WCAG AA checked. Harbor is a light-only look, so it stays the same in dark mode. */
:root {
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --w-reg: 400; --w-med: 500; --w-bold: 700; --w-head: 800; --h1: 28px; --track-head: -0.02em;
  --bg: #F7F3EC; --surface: #FFFDF9; --surface-2: #F2ECE2; --border: #E7DFD2; --border-strong: #8C826E;
  --text: #1E292D; --text-2: #46524F; --text-3: #5F6966; --text-4: #6E7672; --link: #0E6C68;
  --primary: #0E6C68; --on-primary: #FFFFFF; --primary-soft: #D4EBE8; --primary-soft-text: #0A5350; --primary-tint: #EFF7F5; --primary-border: #87C2BC; --primary-text: #0E6C68;
  --focus-ring: rgba(14, 108, 104, .25); --accent: #C2513A; --on-accent: #FFFFFF;
  --success: #2C7A4B; --on-success: #FFFFFF; --success-soft: #E5F2E8; --success-border: #ADD4B8; --success-text: #215F3A;
  --warning: #B4650B; --warning-soft: #FCEFD9; --warning-border: #EDC98C; --warning-text: #874B07;
  --danger: #C2412B; --on-danger: #FFFFFF; --danger-soft: #FCEBE6; --danger-border: #F0B7AA; --danger-text: #97301F;
  --info: #0E6C68; --info-soft: #EFF7F5; --info-border: #BEDDD9;
  --alt-soft: #FBE7E1; --alt-text: #A8432D;
  --disabled-bg: #ECE6DB; --disabled-text: #7C837F;
  --r-sm: 12px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px; --r-mark: 50%; --r-btn: 999px; --r-input: 12px;
  --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 4px 14px -6px rgba(60, 45, 20, .08); --shadow-lg: 0 14px 34px -12px rgba(60, 45, 20, .25);
  --nav-bg: #FFFDF9; --nav-text: #5C6764; --nav-text-strong: #1E292D; --nav-active-bg: #0E6C68; --nav-active-text: #FFFFFF;
  --avatar-bg: #FBE7E1; --avatar-text: #A8432D; --card-border: #EDE6DA; --scrim: rgba(20, 25, 25, .45);
  --demo-bg: #0E6C68; --demo-text: #FFFFFF; color-scheme: light;
}
html, body { margin: 0; background: var(--bg); color: var(--text); }
/* ============ BladeBook component layer ============
   Everything here reads theme tokens. Themes (themes.css) only set tokens
   plus a handful of signature overrides. */
.bb { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-feature-settings: var(--font-features, normal); text-align: left; }
.bb *, .bb *::before, .bb *::after { box-sizing: border-box; }
.bb h1, .bb h2, .bb p { margin: 0; }
.bb button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.bb b { font-weight: var(--w-bold); }
.bb .ic { flex: none; display: block; }
.bb .num, .bb .money, .bb .mono, .bb .stat__value, .bb .slot__time, .bb .wslot, .bb .wl__t, .bb .rl__time, .bb .dchip__n, .bb .cal__num, .bb .delta, .bb .total__v, .bb .codecard__code, .bb .otp__box { font-variant-numeric: tabular-nums; }
.bb .mono { letter-spacing: .04em; }
.bb .center { text-align: center; }
.bb .link { color: var(--link); font-weight: var(--w-med); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.bb .link--danger { color: var(--danger); font-size: 13px; }
.bb .muted, .bb .muted-sm { color: var(--text-3); }
.bb .muted-sm { font-size: 12px; font-weight: var(--w-med); }
.bb .hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

/* ---- type ---- */
.bb .h1 { font-size: var(--h1, 26px); font-weight: var(--w-head); letter-spacing: var(--track-head, -0.02em); line-height: 1.2; color: var(--text); }
.bb .h2 { font-size: 16px; font-weight: var(--w-bold); letter-spacing: -0.01em; line-height: 1.3; }
.bb .lede { color: var(--text-2); font-size: 15px; margin-top: 6px; }
.bb .eyebrow { font-size: 11.5px; font-weight: var(--w-bold); text-transform: var(--eyebrow-case, uppercase); letter-spacing: var(--eyebrow-track, .08em); color: var(--text-3); }
.bb .fine { font-size: 13px; color: var(--text-3); }
.bb .crumb { margin-bottom: 8px; font-size: 13px; }

/* ---- app shell (top layout default) ---- */
.bb .app { position: relative; min-height: 820px; display: flex; flex-direction: column; background: var(--bg); }
.bb .nav { display: flex; align-items: center; gap: 28px; padding: 0 32px; height: 64px; background: var(--nav-bg); color: var(--nav-text); border-bottom: 1px solid var(--nav-border, var(--border)); flex: none; }
.bb .brand { display: flex; align-items: center; gap: 10px; font-weight: var(--w-head); font-size: 17px; letter-spacing: -0.02em; color: var(--brand-text, var(--nav-text-strong, var(--text))); }
.bb .brand__mark { width: 32px; height: 32px; border-radius: var(--r-mark, 9px); background: var(--brand-mark-bg, var(--primary)); color: var(--brand-mark-fg, var(--on-primary)); display: grid; place-items: center; }
.bb .nav__items { display: flex; gap: 4px; flex: 1; }
.bb .nav__item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-sm); color: var(--nav-text); font-weight: var(--w-med); font-size: 14px; cursor: pointer; position: relative; }
.bb .nav__item .ic { width: 16px; height: 16px; opacity: .8; }
.bb .nav__item.is-active { color: var(--nav-active-text); background: var(--nav-active-bg); }
.bb .nav__item.is-active .ic { opacity: 1; }
.bb .nav__user { display: flex; align-items: center; gap: 10px; }
.bb .nav__user-text { display: flex; flex-direction: column; line-height: 1.2; }
.bb .nav__user-text b { font-size: 13px; color: var(--nav-text-strong, var(--text)); }
.bb .nav__user-text small { font-size: 12px; color: var(--nav-text); }
.bb .main { flex: 1; padding: 32px; }
.bb .page { margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.bb .page--narrow { max-width: 760px; }
.bb .page--wide { max-width: 1120px; }
.bb .page--full { max-width: none; }

/* ---- side layout ---- */
.bb[data-layout="side"] .app:not(.app--wizard) { flex-direction: row; }
.bb[data-layout="side"] .nav { flex-direction: column; align-items: stretch; width: 240px; height: auto; padding: 20px 14px; gap: 24px; border-bottom: 0; border-right: 1px solid var(--nav-border, var(--border)); }
.bb[data-layout="side"] .nav .brand { padding: 0 8px; }
.bb[data-layout="side"] .nav__items { flex-direction: column; gap: 2px; }
.bb[data-layout="side"] .nav__item { padding: 10px 12px; }
.bb[data-layout="side"] .nav__item .ic { width: 18px; height: 18px; }
.bb[data-layout="side"] .nav__user { padding: 12px 8px 0; border-top: 1px solid var(--nav-border, var(--border)); }
.bb[data-layout="side"] .main { padding: 32px 40px; }

/* ---- wizard shell ---- */
.bb .app--wizard { min-height: 880px; }
.bb .wbar { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 32px; background: var(--wbar-bg, var(--surface)); border-bottom: 1px solid var(--border); }
.bb .wbar__ctx { color: var(--text-3); font-size: 14px; padding-left: 14px; border-left: 1px solid var(--border); }
.bb .wbar__right { margin-left: auto; font-size: 14px; color: var(--text-2); display: flex; gap: 6px; }
.bb .wmain { padding: 32px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
.bb .wgrid { display: grid; grid-template-columns: 560px 300px; gap: 28px; align-items: start; }
.bb .wcol { display: flex; flex-direction: column; gap: 16px; }
.bb .wcol > .card > .card__body { padding: 32px; gap: 18px; }

/* stepper */
.bb .stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.bb .step { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-3); font-weight: var(--w-med); }
.bb .step__dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: var(--w-bold); border: 1.5px solid var(--border-strong); color: var(--text-3); background: var(--surface); }
.bb .step--current { color: var(--text); }
.bb .step--current .step__dot { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.bb .step--done { color: var(--text-2); }
.bb .step--done .step__dot { background: var(--primary-soft); border-color: transparent; color: var(--primary-soft-text); }
.bb .step__line { width: 36px; height: 1.5px; background: var(--border); list-style: none; }

/* ---- surfaces ---- */
.bb .card { background: var(--surface); border: 1px solid var(--card-border, var(--border)); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.bb .card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 22px 0; }
.bb .card--flush .card__head { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.bb .card__sub { color: var(--text-3); font-size: 13px; margin-top: 3px; }
.bb .card__body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.bb .card--flush .card__body { padding: 0; gap: 0; }
.bb .card__note { display: flex; gap: 8px; align-items: flex-start; padding: 14px 22px; font-size: 13px; color: var(--text-3); background: var(--surface-2); border-top: 1px solid var(--border); }
.bb .card__note .ic { margin-top: 2px; }
.bb .card--center .card__body { align-items: stretch; }
.bb .card--accent { border-color: var(--primary-border, var(--primary)); box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow); }
.bb .card--attn { border-color: var(--warning-border); background: var(--warning-soft); }
.bb .stack { display: flex; flex-direction: column; gap: 16px; }
.bb .sticky { position: sticky; top: 0; }
.bb .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bb .grid2--wide { grid-template-columns: 1fr auto; align-items: end; }
.bb .grid3 { display: grid; grid-template-columns: 1.3fr .8fr 1fr; gap: 14px; align-items: start; }
.bb .split { display: grid; gap: 20px; align-items: start; }
.bb .split--cal { grid-template-columns: 1fr 300px; }
.bb .split--tl { grid-template-columns: 1fr 340px; }
.bb .split--even { grid-template-columns: 1fr 1fr; }
.bb .split--sched { grid-template-columns: 400px 1fr; }

.bb .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.bb .phead__actions { display: flex; gap: 10px; align-items: center; }

/* ---- buttons ---- */
.bb .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-btn, var(--r-sm)); font-weight: var(--w-bold); font-size: 14px; white-space: nowrap; border: 1px solid transparent; transition: background .15s; }
.bb .btn--lg { height: 48px; padding: 0 22px; font-size: 15px; }
.bb .btn--sm { height: 32px; padding: 0 12px; font-size: 13px; }
.bb .btn--block { width: 100%; }
.bb .btn--primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--btn-shadow, none); }
.bb .btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.bb .btn--ghost { color: var(--text-2); }
.bb .btn--danger { background: var(--danger); color: #fff; }
.bb .btn--danger-outline { background: var(--surface); color: var(--danger); border-color: var(--danger-border); }
.bb .btn[disabled] { background: var(--disabled-bg); color: var(--disabled-text); border-color: transparent; box-shadow: none; cursor: not-allowed; }
.bb .iconbtn { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); flex: none; }
.bb .iconbtn--sm { width: 30px; height: 30px; border-color: transparent; background: transparent; }
.bb .btngroup { display: flex; gap: 6px; align-items: center; }
.bb .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bb .actions__r { display: flex; gap: 10px; }
.bb .stickybar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
.bb .stickybar__note { flex: 1; text-align: right; color: var(--text-3); font-size: 13px; }

/* ---- form ---- */
.bb .field, .bb .fieldset { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.bb .label { font-size: 13px; font-weight: var(--w-bold); color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.bb .label__opt { font-weight: var(--w-reg); color: var(--text-3); font-size: 12px; }
.bb .input { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid var(--input-border, var(--border-strong)); border-radius: var(--r-input, var(--r-sm)); background: var(--input-bg, var(--surface)); font-size: 15px; color: var(--text); }
.bb .input.is-focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.bb .input.is-placeholder .input__val { color: var(--text-3); }
.bb .input--mono .input__val { letter-spacing: .08em; font-weight: var(--w-med); }
.bb .input--readonly { background: var(--surface-2); justify-content: space-between; }
.bb .input__val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb .input__affix { color: var(--text-3); font-size: 14px; }
.bb .input__lead, .bb .input__chev { color: var(--text-3); }
.bb .input__ok { width: 22px; height: 22px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; }
.bb .field--error .input { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.bb .hint { font-size: 12.5px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
.bb .hint--error { color: var(--danger); }
.bb .rules { list-style: none; margin: -4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-3); }
.bb .rules li { display: flex; align-items: center; gap: 5px; }
.bb .rules li.is-ok { color: var(--success-text); }

.bb .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--seg-bg, var(--surface-2)); border: 1px solid var(--border); border-radius: var(--r-sm); }
.bb .seg--block { display: flex; }
.bb .seg--block .seg__opt { flex: 1; }
.bb .seg__opt { padding: 7px 12px; border-radius: calc(var(--r-sm) - 3px); font-size: 13px; font-weight: var(--w-med); color: var(--text-2); text-align: center; white-space: nowrap; cursor: pointer; }
.bb .seg__opt.is-on { background: var(--seg-on-bg, var(--surface)); color: var(--seg-on-text, var(--text)); box-shadow: var(--seg-on-shadow, 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border)); font-weight: var(--w-bold); }

.bb .check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.bb .check__box { width: 20px; height: 20px; flex: none; border-radius: 5px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; background: var(--surface); margin-top: 1px; }
.bb .check__box.is-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.bb .check__text { display: flex; flex-direction: column; gap: 3px; }
.bb .check__label { font-weight: var(--w-bold); font-size: 14px; }
.bb .check__sub { font-size: 12.5px; color: var(--text-3); }

.bb .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 22px; border-bottom: 1px solid var(--border); }
.bb .card__body > .toggle-row:first-child { padding-top: 0; }
.bb .card:not(.card--flush) .toggle-row { padding: 0 0 14px; }
.bb .toggle-row__label { font-weight: var(--w-bold); }
.bb .toggle-row__sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.bb .switch { width: 40px; height: 24px; border-radius: 999px; background: var(--switch-off, var(--border-strong)); position: relative; flex: none; }
.bb .switch__knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.bb .switch.is-on { background: var(--primary); }
.bb .switch.is-on .switch__knob { left: 19px; }

.bb .rcard { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.bb .rcard.is-on { border-color: var(--primary); background: var(--primary-tint); box-shadow: 0 0 0 1px var(--primary); }
.bb .rcard__icon { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; flex: none; }
.bb .rcard.is-on .rcard__icon { background: var(--primary-soft); color: var(--primary-soft-text); }
.bb .rcard__text { flex: 1; min-width: 0; }
.bb .rcard__title { font-weight: var(--w-bold); }
.bb .rcard__sub { font-size: 13px; color: var(--text-3); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.bb .radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex: none; background: var(--surface); }
.bb .radio.is-on { border: 6px solid var(--primary); }
.bb .inline-select { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-weight: var(--w-bold); }

.bb .days { display: flex; gap: 6px; }
.bb .day { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; border: 1px solid var(--border-strong); font-weight: var(--w-bold); font-size: 13px; color: var(--text-2); position: relative; background: var(--surface); }
.bb .day.is-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.bb .day.has-other::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
.bb .day.is-on.has-other::after { background: var(--on-primary); }

.bb .otp { display: flex; gap: 10px; justify-content: center; }
.bb .otp__box { width: 50px; height: 58px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 24px; font-weight: var(--w-bold); background: var(--surface); }
.bb .otp__box.is-focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }

/* ---- feedback ---- */
.bb .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: var(--r-md); border: 1px solid; font-size: 14px; }
.bb .banner__icon { margin-top: 1px; }
.bb .banner__title { font-weight: var(--w-bold); }
.bb .banner__body { color: var(--text-2); }
.bb .banner__title + .banner__body { margin-top: 2px; }
.bb .banner--success { background: var(--success-soft); border-color: var(--success-border); } .bb .banner--success .banner__icon { color: var(--success); }
.bb .banner--warning { background: var(--warning-soft); border-color: var(--warning-border); } .bb .banner--warning .banner__icon { color: var(--warning); }
.bb .banner--danger { background: var(--danger-soft); border-color: var(--danger-border); } .bb .banner--danger .banner__icon { color: var(--danger); } .bb .banner--danger .banner__title { color: var(--danger-text); }
.bb .banner--info { background: var(--info-soft); border-color: var(--info-border); } .bb .banner--info .banner__icon { color: var(--info); }

.bb .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-badge, 999px); font-size: 12px; font-weight: var(--w-bold); white-space: nowrap; vertical-align: middle; line-height: 1.3; }
.bb .badge--neutral { background: var(--surface-2); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
.bb .badge--primary { background: var(--primary-soft); color: var(--primary-soft-text); }
.bb .badge--success { background: var(--success-soft); color: var(--success-text); }
.bb .badge--warning { background: var(--warning-soft); color: var(--warning-text); }
.bb .badge--danger { background: var(--danger-soft); color: var(--danger-text); }

.bb .help { background: var(--help-bg, var(--surface-2)); border: 1px solid var(--help-border, transparent); border-radius: var(--r-lg); padding: 18px 20px; font-size: 13.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
.bb .help__title { display: flex; align-items: center; gap: 8px; font-weight: var(--w-bold); color: var(--text); }
.bb .help__title .ic { color: var(--primary); }
.bb .help__body p + p { margin-top: 8px; }
.bb .numlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.bb .numlist small { color: var(--text-3); }

/* schedule creator */

.bb .wkbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.bb .row__side:has(.sh-badge) { flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; }

/* Today: the large rinkside link (ADR-023, amended 2026-10-13) */
.bb .rink-cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; }
.bb .rink-cta__text { display: grid; gap: 2px; min-width: 0; flex: 1 1 260px; }
.bb .rink-cta__text b { font-size: 17px; }

/* Coach code waiting for the business email (ADR-016, amended 2026-11-06) */
.bb .codecard__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bb .codecard--pending { background: var(--surface-2, var(--bg)); border-style: dashed; }
.bb .codecard--pending .codecard__code { color: var(--text-3); }
.bb .codewait { margin-bottom: 16px; }
.bb .codewait__links { margin: 6px 0 0 4px; }

/* Calendar group — month grid, clickable week items, day rows. Harbor tokens only. */
.bb .cal-scroll { overflow-x: auto; }
.bb .cal-scroll .week { min-width: 860px; }

/* month: week links in the first column, then Sun–Sat */
.bb .cal-month { display: grid; grid-template-columns: 112px repeat(7, minmax(0, 1fr)); gap: 8px; min-width: 760px; margin-top: 14px; }
.bb .cal-month__h { font-size: 12px; font-weight: var(--w-bold); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 2px; }
.bb .cal-wk { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); text-align: left; font: inherit; color: var(--text); cursor: pointer; }
.bb .cal-wk b { font-size: 13.5px; }
.bb .cal-wk small { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.bb .cal-wk:hover, .bb .cal-day:hover { border-color: var(--primary); }
.bb .cal-wk.is-now { background: var(--primary-tint); border-color: var(--primary-border); }
.bb .cal-day { min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; padding: 9px 10px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border-strong); text-align: left; font: inherit; color: var(--text); cursor: pointer; }
.bb .cal-day__num { display: flex; align-items: center; gap: 6px; font-weight: var(--w-bold); font-size: 15px; font-variant-numeric: tabular-nums; }
.bb .cal-day__num em { font-style: normal; font-size: 10.5px; background: var(--primary); color: var(--on-primary); padding: 1px 6px; border-radius: 999px; }
.bb .cal-day__meta { display: flex; flex-wrap: wrap; gap: 4px; }
.bb .cal-day__none { font-size: 12px; color: var(--text-3); }
.bb .cal-day--off { background: var(--surface-2); border-color: var(--border); }
.bb .cal-day--off .cal-day__num { font-weight: var(--w-reg); color: var(--text-3); }
.bb .cal-day--past { opacity: .7; }
.bb .cal-day--out { opacity: .4; }
.bb .cal-day.is-today { box-shadow: inset 0 0 0 2px var(--primary); }
.bb .cal-chip { font-size: 11.5px; font-weight: var(--w-bold); padding: 2px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-soft-text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bb .cal-chip--open { background: var(--surface-2); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
.bb .cal-chip--special { background: var(--alt-soft); color: var(--alt-text); }
.bb .cal-chip--off { background: var(--warning-soft); color: var(--warning-text); }

/* week: clickable heads and lessons */
.bb button.cal-head { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--border); text-align: left; font: inherit; cursor: pointer; }
.bb button.cal-head:hover b { color: var(--primary-text); }
.bb button.cal-wl { width: 100%; text-align: left; font: inherit; cursor: pointer; border-top: 0; border-right: 0; border-bottom: 0; }
.bb button.cal-wl:hover { box-shadow: 0 0 0 2px var(--danger-border); }
.bb .cal-colnote { margin: 8px 10px 0; font-size: 11.5px; font-weight: var(--w-bold); color: var(--alt-text); background: var(--alt-soft); padding: 3px 8px; border-radius: 999px; align-self: flex-start; }
.bb .week__empty small { font-size: 11.5px; }

/* day */
.bb .cal-slot__t { width: 76px; flex: none; font-weight: var(--w-bold); font-size: 13.5px; color: var(--text-2); }

@media (max-width: 760px) {
  .bb .cal-slot__t { width: 64px; }
  .bb .legend__note { margin-left: 0; }
}

/* Lessons, Payments, Profile, Email templates — additions to harbor.css. Harbor tokens only. */
.bb .mp-filters { flex-wrap: wrap; }
.bb .mp-filters .field { width: 200px; max-width: 100%; }
.bb .mp-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 16px; }
.bb .mp-empty__icon { width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); color: var(--text-3); display: grid; place-items: center; }
.bb .mp-phase { display: inline-flex; align-items: center; gap: 8px; }
.bb .mp-tablewrap { overflow-x: auto; position: relative; }
.bb .mp-tablewrap .table { min-width: 760px; }
.bb .mp-tablewrap td { vertical-align: middle; }
.bb .mp-sub { display: block; font-weight: var(--w-reg); font-size: 12.5px; color: var(--text-3); }
.bb .table tr.mp-attn td { background: var(--warning-soft); }
.bb .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* profile */
.bb .mp-tabs { overflow-x: auto; }
.bb a.tabs__t { text-decoration: none; white-space: nowrap; }
.bb a.tabs__t:hover { color: var(--text); }
.bb .mp-photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bb .mp-photo__text { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 2px; }
.bb .mp-radios { display: flex; flex-direction: column; gap: 10px; }
.bb .mp-rrow { display: flex; align-items: center; gap: 12px; }
.bb .mp-rrow > .rcard { flex: 1; min-width: 0; }
.bb button.rcard { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.bb button.rcard .rcard__title, .bb button.rcard .rcard__sub { display: block; overflow-wrap: anywhere; }
.bb .mp-rcard--pending { border-style: dashed; flex-wrap: wrap; }
.bb .mp-rcard--pending .rcard__text { flex: 1; min-width: 180px; }
.bb .mp-add { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); }
.bb .mp-add .cellbtns { justify-content: flex-end; }
.bb .mp-remove { flex: none; }
.bb .mp-grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
/* email templates */
.bb .mp-split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: start; }
.bb .mp-tpl { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--border); }
.bb .mp-tpl:last-child { border-bottom: 0; }
.bb .mp-tpl.is-on { background: var(--primary-tint); box-shadow: inset 3px 0 0 var(--primary); }
.bb .mp-tpl__pick { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.bb .mp-tpl__name { font-weight: var(--w-bold); }
.bb .mp-tpl__when { font-size: 13px; color: var(--text-3); }
.bb .mp-mail { padding: 18px 22px; }
.bb .mp-mail.is-off { opacity: .55; }
.bb .mp-mail__head { padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
.bb .mp-mail__head .kv__v { text-align: right; overflow-wrap: anywhere; }
.bb .mp-mail__body { display: flex; flex-direction: column; gap: 10px; line-height: 1.55; }
.bb .mp-mail__sig { color: var(--text-3); }
@media (max-width: 760px) {
  .bb .mp-split, .bb .mp-grid3 { grid-template-columns: minmax(0, 1fr); }
  .bb .mp-filters .field { width: 100%; }
  .bb .mp-filters .seg { margin-left: 0; }
  .bb .mp-tpl { padding: 12px 16px; }
  .bb .mp-mail { padding: 16px; }
  .bb .mp-rrow { flex-wrap: wrap; }
}
/* how they paid (Payments) */
.bb .mp-how { display: block; margin-top: 4px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
.bb .mp-how .link { cursor: pointer; }
.bb .mp-sub .ic { vertical-align: -2px; }
.bb .mp-how-pick { text-align: left; }
.bb .mp-how-pick .seg { flex-wrap: wrap; }
.bb .mp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
/* financial summary */
.bb .fin-split { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
.bb .fin-table { min-width: 680px; }
.bb .fin-table tfoot td { background: var(--surface-2); border-bottom: 0; }
.bb .fin-table tr.fin-none td { color: var(--text-3); }
.bb .fin-ice__row { display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.bb .fin-ice__row:first-of-type { border-top: 0; }
@media (max-width: 980px) {
  .bb .fin-split { grid-template-columns: minmax(0, 1fr); }
}

/* One switch per payment type, each with its handle (ADR-016 d7, amended 2026-10-12) */
.bb .paytype { padding: 4px 0 12px; border-bottom: 1px solid var(--border); }
.bb .paytype:last-of-type { border-bottom: 0; }
.bb .paytype .field { margin-top: 4px; }

/* Students — roster and pending sign-ups. Harbor tokens only. */
.bb .stu-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: var(--w-bold); font-variant-numeric: tabular-nums; }
.bb .seg__opt.is-on .stu-count { background: var(--primary-soft); color: var(--primary-soft-text); }
.bb .stu-count--attn { background: var(--alt-soft); color: var(--alt-text); }
.bb .stu-search { max-width: 420px; }
.bb .stu-tablewrap { overflow-x: auto; position: relative; }
.bb .stu-table { min-width: 760px; }
.bb .stu-table td { vertical-align: top; }
.bb .stu-sub { display: block; margin-top: 2px; font-size: 13px; color: var(--text-3); font-weight: var(--w-reg); }
.bb .stu-contact { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; color: var(--text-2); }
.bb .stu-contact span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow-wrap: anywhere; }
.bb .stu-contact .ic { color: var(--text-3); }
.bb .stu-family { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.bb .stu-family .stu-contact { margin-top: 0; }
.bb .stu-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text-2); }
.bb .dialog .field { text-align: left; }
@media (max-width: 760px) {
  .bb .stu-family { padding: 12px 16px; }
  .bb .stu-search { max-width: none; }
}

.bb .stu-blocks { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; text-align: left; }
.bb .stu-table .stu-sub .btn { margin-top: 4px; margin-left: -12px; }

/* pending: a skater invited to share a lesson (ADR-026 d5) */
.bb .stu-join { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--primary-tint); color: var(--text-2); font-size: 13px; line-height: 1.4; max-width: 520px; }
.bb .stu-join .ic { flex: none; margin-top: 2px; color: var(--primary-text); }

.demo-bar a { color: inherit; font-weight: 700; }
</style>
</head>
<body>
<div class="demo-bar"><span><b>Interactive demo</b> · sample data · today is Wed, Oct 14, 8:15 AM · signed-out pages: <a href="#login">Log in</a> · <a href="#forgot">Forgot password</a> · <a href="#signup">Sign up</a></span><button type="button" onclick="resetDemo()">Reset demo</button></div>
<div class="bb" data-layout="top"><div id="app"></div></div>
<script>
/* BladeBook screen library — extracted unchanged from design/redesign/option-5-harbor.html
   (2026-10-01). Helpers, shells and the 41 original screens (window.BB_SCREENS). */
/* BladeBook redesign — shared screen library.
   Every screen is built from the same small component vocabulary, so each
   theme only has to style ~40 class names to restyle the whole product. */

const ICONS = {
  logo: '<path d="M8.5 3v9.2c0 1.6 1 2.7 2.7 3.2l5.6 1.7"/><path d="M4 20h16"/><path d="M6.5 20v-2"/><path d="M17.5 20v-2.3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>',
  chevD: '<path d="m6 9 6 6 6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  wifiOff: '<path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  calOff: '<path d="M4.18 4.18A2 2 0 0 0 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 1.82-1.18M21 15.5V6a2 2 0 0 0-2-2H9.5M3 10h7M21 10h-5.5M16 2v4M8 2v4M2 2l20 20"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>',
  spark: '<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  arrowR: '<path d="M5 12h14M12 5l7 7-7 7"/>',
  arrowL: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trend: '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
};
const ic = (n, s = 16, cls = '') =>
  `<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- primitives ---------- */
const btn = (label, v = 'primary', o = {}) =>
  `<button class="btn btn--${v}${o.block ? ' btn--block' : ''}${o.lg ? ' btn--lg' : ''}${o.sm ? ' btn--sm' : ''}"${o.disabled ? ' disabled' : ''}>${o.icon ? ic(o.icon, o.sm ? 14 : 16) : ''}<span>${label}</span>${o.iconR ? ic(o.iconR, 16) : ''}</button>`;
const badge = (t, v = 'neutral', icon) => `<span class="badge badge--${v}">${icon ? ic(icon, 12) : ''}${t}</span>`;
const banner = (v, title, body = '', icon) => {
  const i = icon || { success: 'check', warning: 'alert', danger: 'alert', info: 'info' }[v];
  return `<div class="banner banner--${v}"><span class="banner__icon">${ic(i, 18)}</span><div class="banner__text">${title ? `<div class="banner__title">${title}</div>` : ''}${body ? `<div class="banner__body">${body}</div>` : ''}</div></div>`;
};
const field = (label, value, o = {}) => `
  <div class="field${o.error ? ' field--error' : ''}">
    <label class="label">${label}${o.optional ? ' <span class="label__opt">Optional</span>' : ''}</label>
    <div class="input${o.area ? ' input--area' : ''}${o.select ? ' input--select' : ''}${o.focus ? ' is-focus' : ''}${o.placeholder ? ' is-placeholder' : ''}${o.mono ? ' input--mono' : ''}">
      ${o.prefix ? `<span class="input__affix">${o.prefix}</span>` : ''}${o.lead ? ic(o.lead, 16, 'input__lead') : ''}
      <span class="input__val">${value}</span>
      ${o.suffix ? `<span class="input__affix">${o.suffix}</span>` : ''}${o.select ? ic('chevD', 16, 'input__chev') : ''}${o.ok ? `<span class="input__ok">${ic('check', 14)}</span>` : ''}
    </div>
    ${o.hint ? `<div class="hint${o.error ? ' hint--error' : ''}">${o.error ? ic('alert', 14) : ''}${o.hint}</div>` : ''}
  </div>`;
const seg = (opts, active, o = {}) =>
  `<div class="seg${o.block ? ' seg--block' : ''}">${opts.map((x, i) => `<span class="seg__opt${i === active ? ' is-on' : ''}">${x}</span>`).join('')}</div>`;
const check = (label, on, sub = '') =>
  `<label class="check"><span class="check__box${on ? ' is-on' : ''}">${on ? ic('check', 13) : ''}</span><span class="check__text"><span class="check__label">${label}</span>${sub ? `<span class="check__sub">${sub}</span>` : ''}</span></label>`;
const toggle = (label, on, sub = '') =>
  `<div class="toggle-row"><div class="toggle-row__text"><div class="toggle-row__label">${label}</div>${sub ? `<div class="toggle-row__sub">${sub}</div>` : ''}</div><span class="switch${on ? ' is-on' : ''}"><span class="switch__knob"></span></span></div>`;
const radioCard = (title, sub, on, icon) =>
  `<div class="rcard${on ? ' is-on' : ''}">${icon ? `<span class="rcard__icon">${ic(icon, 20)}</span>` : ''}<div class="rcard__text"><div class="rcard__title">${title}</div>${sub ? `<div class="rcard__sub">${sub}</div>` : ''}</div><span class="radio${on ? ' is-on' : ''}"></span></div>`;
const avatar = (t, sz = '') => `<span class="avatar${sz ? ' avatar--' + sz : ''}">${t}</span>`;
const eyebrow = t => `<div class="eyebrow">${t}</div>`;
const pageHead = (title, sub = '', actions = '', crumb = '') =>
  `<div class="phead"><div class="phead__text">${crumb ? `<div class="crumb">${crumb}</div>` : ''}<h1 class="h1">${title}</h1>${sub ? `<p class="lede">${sub}</p>` : ''}</div>${actions ? `<div class="phead__actions">${actions}</div>` : ''}</div>`;
const card = (body, o = {}) =>

/* ---------- data ---------- */
function monthGrid(year, month, cellFn, o = {}) {
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal__cell cal__cell--pad"></div>';
  for (let d = 1; d <= days; d++) cells += cellFn(d, (first + d - 1) % 7);
  return `<div class="cal${o.cls ? ' ' + o.cls : ''}"><div class="cal__dow">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<span>${x}</span>`).join('')}</div><div class="cal__grid">${cells}</div></div>`;
}

/* BladeBook coach website — Calendar group: month, week, day, and the cancel preview.
   Registers SCREENS 'calendar-month', 'calendar-week', 'calendar-day', 'cancel-preview'.
   State lives in state.ui.cal. Sources: FeatureDecriptions/Coach Dashboard on website.md,
   cancelation.md, ADR-009 (coach cancellation, release or hold), ADR-026 d6 (every skater in a shared lesson).
   2026-11-08 (owner, S8/S9/S11): release-or-hold is asked per lesson for a lesson or a day, with no "Release all";
   Cancel rest of week holds every booked lesson and open time left in the week, with no question; an unanswered
   invitation on a cancelled lesson is removed quietly (no record, no email; ADR-031). */

const calUi = () => (state.ui.cal ??= { month: TODAY.slice(0, 8) + '01', week: weekStart(TODAY), day: TODAY, sel: [], hold: {}, open: [], weekAll: false, back: 'calendar-week', what: '' });

/** Every slot on a date, merged with what occupies it: [{t, len, price, lesson|null}]. */
function calSlots(iso) {
  const ls = lessonsOn(iso);
  const out = slotsOn(iso).map(s => ({ ...s, lesson: ls.find(l => l.t === s.t) || null }));
  for (const l of ls) if (!out.some(s => s.t === l.t)) out.push({ t: l.t, len: l.len, price: l.price, lesson: l });
  return out.sort((a, b) => a.t - b.t);
}
const calSlotPast = (iso, s) => iso < TODAY || (iso === TODAY && s.t + s.len <= NOW_MIN);
const calCancellable = l => !!(l && l.sid && !isStarted(l));
const calFuture = iso => lessonsOn(iso).filter(calCancellable);
const calWhere = iso => { const sp = specialOn(iso); return sp ? (sp.kind === 'timeoff' ? `Time off · ${sp.name}` : `Special schedule · ${sp.name}`) : ''; };
const calViewSeg = on => SEG(['Month', 'Week', 'Day'], on, 'calView');
/** Open times not yet started on a date: [{iso, t, len}]. Cancel rest of week holds them too (ADR-009, 2026-11-08). */
const calOpenFuture = iso => calSlots(iso).filter(s => !s.lesson && !(iso < TODAY || (iso === TODAY && s.t <= NOW_MIN))).map(s => ({ iso, t: s.t, len: s.len }));
/** What Cancel rest of week closes: booked lessons and open times from now to Saturday (all of a future week). */
function calRestOfWeek(ws) {
  const days = [0, 1, 2, 3, 4, 5, 6].map(k => addDays(ws, k));
  const lessons = days.flatMap(calFuture), open = days.flatMap(calOpenFuture);
  const dates = [...lessons.map(l => l.iso), ...open.map(o => o.iso)].sort();
  return { lessons, open, first: dates[0], last: dates[dates.length - 1] };
}
const calRange = (a, b) => a === b ? dDow(a) : `${dDow(a)} – ${dDow(b)}`;

function calStartCancel(ids, back, what) {
  const c = calUi();
  c.sel = ids.filter(id => calCancellable(state.lessons.find(l => l.id === id)));
  c.hold = {}; c.open = []; c.weekAll = false; c.back = back; c.what = what;
  go('cancel-preview');
}

Object.assign(ACTIONS, {
  calView(i) { go(['calendar-month', 'calendar-week', 'calendar-day'][i]); },
  calMonth(d) { const c = calUi(), m = parseIso(c.month); m.setMonth(m.getMonth() + d); c.month = toIso(m); },
  calMonthToday() { calUi().month = TODAY.slice(0, 8) + '01'; },
  calWeek(d) { const c = calUi(); c.week = addDays(c.week, 7 * d); },
  calWeekToday() { calUi().week = weekStart(TODAY); },
  calDay(d) { const c = calUi(); c.day = addDays(c.day, d); },
  calDayToday() { calUi().day = TODAY; },
  calOpenDay(iso) { const c = calUi(); c.day = iso; c.week = weekStart(iso); go('calendar-day'); },
  calOpenWeek(iso) { const c = calUi(); c.week = weekStart(iso); c.day = iso; go('calendar-week'); },
  calCancelOne(id, back) { const l = state.lessons.find(x => x.id === id); calStartCancel([id], back, `${whoIn(l)}’s lesson`); },
  calCancelDay(iso, back) { calStartCancel(calFuture(iso).map(l => l.id), back, dDow(iso)); },
  calCancelRest() {
    const c = calUi(), r = calRestOfWeek(c.week);
    calStartCancel(r.lessons.map(l => l.id), 'calendar-week', 'the rest of the week');
    c.weekAll = true; c.open = r.open;
    for (const l of r.lessons) c.hold[l.id] = true;   // the whole week is held; no release-or-hold question
  },
  calHold(id, i) { calUi().hold[id] = i === 1; },
  calBack() { go(calUi().back); },
  calAccept() {
    const c = calUi();
    const sel = state.lessons.filter(l => c.sel.includes(l.id) && calCancellable(l));
    const fams = families(sel.flatMap(l => skatersIn(l).map(p => student(p.sid))));
    for (const l of sel) {
      // An unanswered shared-lesson invitation is removed quietly: no record, no email; a later answer writes nothing
      // (ADR-031, owner 2026-11-08, S11). Recording it and telling the invited family is Phase 2.
      if (l.invited) state.invites = state.invites.filter(i => !(i.skater === l.invited && i.iso === l.iso && i.t === l.t && i.status === 'SENT'));
      if (c.hold[l.id]) { Object.assign(l, { sid: null, status: 'COACH_HELD', price: 0, pay: null, recurring: false }); delete l.with; delete l.invited; }
      else state.lessons = state.lessons.filter(x => x !== l);
    }
    const open = c.weekAll ? c.open : [];
    for (const o of open) state.lessons.push({ id: `h-${o.iso}-${o.t}`, sid: null, iso: o.iso, t: o.t, len: o.len, price: 0, status: 'COACH_HELD', pay: null });
    const held = sel.filter(l => c.hold[l.id]).length;
    c.sel = []; c.hold = {}; c.open = []; c.weekAll = false;
    go(c.back);
    state.flash = `${plural(sel.length, 'lesson')} cancelled${held ? `, ${held} held closed` : ''}${open.length ? `, ${plural(open.length, 'open time')} closed` : ''}. ${plural(fams.length, 'family', 'families')} will be emailed.`;
  },
});

/* ---------- Month ---------- */
SCREENS['calendar-month'] = () => {
  const c = calUi(), m = parseIso(c.month), y = m.getFullYear(), mo = m.getMonth();
  const first = c.month, last = toIso(new Date(y, mo + 1, 0));
  const weeks = [];
  for (let ws = weekStart(first); ws <= last; ws = addDays(ws, 7)) weeks.push(ws);
  let booked = 0, open = 0;
  const cell = iso => {
    const inMonth = iso >= first && iso <= last, slots = calSlots(iso), sp = specialOn(iso);
    const b = slots.filter(s => s.lesson && s.lesson.sid).length, o = slots.filter(s => !s.lesson && !calSlotPast(iso, s)).length;
    if (inMonth) { booked += b; open += o; }
    const cls = `cal-day${slots.length ? '' : ' cal-day--off'}${inMonth ? '' : ' cal-day--out'}${iso === TODAY ? ' is-today' : ''}${iso < TODAY ? ' cal-day--past' : ''}`;
    const tag = sp ? `<span class="cal-chip cal-chip--${sp.kind === 'timeoff' ? 'off' : 'special'}">${sp.kind === 'timeoff' ? 'Time off' : 'Camp'}</span>` : '';
    const meta = slots.length ? `${b ? `<span class="cal-chip">${b} booked</span>` : ''}${o ? `<span class="cal-chip cal-chip--open">${o} open</span>` : ''}` : (sp ? '' : '<span class="cal-day__none">No lessons</span>');
    return `<button type="button" class="${cls}"${actAttr('calOpenDay', [iso])} aria-label="${dLong(iso)}: ${b} booked, ${o} open"><span class="cal-day__num">${parseIso(iso).getDate()}${iso === TODAY ? '<em>Today</em>' : ''}</span><span class="cal-day__meta">${tag}${meta}</span></button>`;
  };
  const rows = weeks.map((ws, i) => {
    const days = [0, 1, 2, 3, 4, 5, 6].map(k => cell(addDays(ws, k))).join('');
    return `<button type="button" class="cal-wk${ws <= TODAY && TODAY <= addDays(ws, 6) ? ' is-now' : ''}"${actAttr('calOpenWeek', [ws < first ? first : ws])}><b>Week ${i + 1}</b><small>${dShort(ws < first ? first : ws)} – ${dShort(addDays(ws, 6) > last ? last : addDays(ws, 6))}</small></button>${days}`;
  }).join('');
  const body = `
    <div class="calbar"><button type="button" class="iconbtn" aria-label="Previous month"${actAttr('calMonth', [-1])}>${ic('chevL', 18)}</button><div class="calbar__title">${MON_LONG[mo]} ${y}</div><button type="button" class="iconbtn" aria-label="Next month"${actAttr('calMonth', [1])}>${ic('chevR', 18)}</button>${B('Today', 'secondary', 'calMonthToday', { sm: true })}</div>
    <div class="cal-scroll"><div class="cal-month"><span class="cal-month__h"></span>${DOW.map(d => `<span class="cal-month__h">${d}</span>`).join('')}${rows}</div></div>
    <div class="legend"><span class="legend__item"><i class="sw sw--booked"></i>Booked lessons</span><span class="legend__item"><i class="sw sw--open"></i>Open times left</span><span class="legend__item"><i class="sw sw--off"></i>No lessons scheduled</span><span class="legend__note">Pick a day for its lessons, or a week on the left.</span></div>`;
  return shell(`
    ${pageHead('Calendar', `${MON_LONG[mo]}: ${plural(booked, 'lesson')} booked, ${plural(open, 'open time')} left.`, calViewSeg(0))}
    ${card(body)}`, { width: 'wide' });
};

/* ---------- Week ---------- */
SCREENS['calendar-week'] = () => {
  const c = calUi(), ws = c.week, we = addDays(ws, 6);
  const cols = [0, 1, 2, 3, 4, 5, 6].map(k => {
    const iso = addDays(ws, k), slots = calSlots(iso), fut = calFuture(iso), sp = specialOn(iso);
    const colCls = iso < TODAY ? ' week__col--past' : iso === TODAY ? ' week__col--today' : '';
    const items = slots.map(s => {
      const l = s.lesson, past = calSlotPast(iso, s);
      const kind = !l ? 'open' : l.sid ? '' : 'held';
      const cls = `wl${kind ? ' wl--' + kind : ''}${past ? ' wl--past' : ''}`;
      const name = !l ? 'Open' : l.sid ? esc(whoIn(l)) : 'Held';
      const inner = `<span class="wl__t">${fmtShortT(s.t)}${s.len !== 30 ? ` · ${s.len}m` : ''}</span><span class="wl__n">${name}</span>`;
      return calCancellable(l)
        ? `<button type="button" class="${cls} cal-wl" title="Cancel ${esc(whoIn(l, false))}’s lesson"${actAttr('calCancelOne', [l.id, 'calendar-week'])}>${inner}</button>`
        : `<div class="${cls}">${inner}</div>`;
    }).join('');
    const empty = sp && sp.kind === 'timeoff' ? `Time off<br><small>${esc(sp.name)}</small>` : 'No lessons';
    return `<div class="week__col${colCls}"><button type="button" class="week__head cal-head"${actAttr('calOpenDay', [iso])}><span>${DOW[dowOf(iso)]}</span><b>${parseIso(iso).getDate()}</b>${iso === TODAY ? '<em>Today</em>' : ''}</button>${sp && sp.kind === 'special' ? `<div class="cal-colnote">${esc(sp.name)}</div>` : ''}<div class="week__body">${items || `<div class="week__empty">${empty}</div>`}</div>${fut.length ? `<button type="button" class="week__cancel"${actAttr('calCancelDay', [iso, 'calendar-week'])}>Cancel day</button>` : ''}</div>`;
  }).join('');
  const thisWeek = ws === weekStart(TODAY), r = calRestOfWeek(ws);
  const restBtn = r.first ? B(`Cancel rest of week: ${calRange(r.first, r.last)} (${plural(r.lessons.length, 'lesson')}, ${plural(r.open.length, 'open time')})`, 'danger-outline', 'calCancelRest', { icon: 'calOff' }) : '';
  return shell(`
    ${pageHead(`Week of ${dShort(ws)}`, thisWeek ? `It’s ${DOW_LONG[dowOf(TODAY)]} ${fmtT(NOW_MIN)}. Past lessons are greyed and can’t be cancelled.` : `${dShort(ws)} – ${dShort(we)}. Tap a booked lesson to cancel just that one.`,
      `${calViewSeg(1)}<div class="btngroup"><button type="button" class="iconbtn" aria-label="Previous week"${actAttr('calWeek', [-1])}>${ic('chevL', 18)}</button>${B('Today', 'secondary', 'calWeekToday', { sm: true })}<button type="button" class="iconbtn" aria-label="Next week"${actAttr('calWeek', [1])}>${ic('chevR', 18)}</button></div>${restBtn}`)}
    ${card(`<div class="cal-scroll"><div class="week">${cols}</div></div>`, { pad: false })}
    <div class="legend"><span class="legend__item"><i class="sw sw--booked"></i>Booked</span><span class="legend__item"><i class="sw sw--open"></i>Open</span><span class="legend__item"><i class="sw sw--held"></i>Held (you kept it closed)</span><span class="legend__item"><i class="sw sw--off"></i>Past</span><span class="legend__note">Sick today? Use Cancel day. Your schedule doesn’t change.</span></div>`, { width: 'wide' });
};

/* ---------- Day ---------- */
SCREENS['calendar-day'] = () => {
  const c = calUi(), iso = c.day, slots = calSlots(iso), sp = specialOn(iso), fut = calFuture(iso);
  const booked = slots.filter(s => s.lesson && s.lesson.sid);
  const rows = slots.map(s => {
    const l = s.lesson, past = calSlotPast(iso, s);
    const who = !l ? `<span class="roundicon">${ic('plus', 14)}</span>${rowTitle('Open', 'Families can book this time')}`
      : !l.sid ? `<span class="roundicon roundicon--warn">${ic('lock', 14)}</span>${rowTitle('Held', 'You kept this time closed')}`
      : `${avatar(initials(nameOf(l)), 'sm')}${rowTitle(esc(whoIn(l, false)) + (isShared(l) ? ' ' + badge('Shared', 'primary', 'users') : ''), `${familiesIn(l).map(esc).join(' · ')}${l.recurring ? ` · ${(l.interval || 1) === 1 ? 'repeats weekly' : `repeats every ${l.interval} weeks`}` : ''}`)}`;
    const side = `<span class="muted num">${s.len} min · ${l && l.sid ? skatersIn(l).map(p => money(p.price)).join(' + ') : money(s.price)}</span>${l && l.sid && isStarted(l) ? skaterBadges(l) : ''}${calCancellable(l) ? B('Cancel', 'ghost', 'calCancelOne', { sm: true, args: [l.id, 'calendar-day'] }) : ''}`;
    return row(`<span class="cal-slot__t num">${fmtT(s.t)}</span>${who}`, side, { cls: past ? 'row--muted' : '' });
  }).join('');
  const empty = sp && sp.kind === 'timeoff'
    ? `<div class="pempty"><span class="pempty__icon">${ic('calOff', 22)}</span><b>Time off: ${esc(sp.name)}</b><span class="muted">${dShort(sp.sd)} – ${dShort(sp.ed)}. Families can’t book these days.</span></div>`
    : `<div class="pempty"><span class="pempty__icon">${ic('calendar', 22)}</span><b>No lessons on ${DOW_LONG[dowOf(iso)]}s</b><span class="muted">Your weekly schedule has nothing on this day. <a class="link" href="${SCHEDULE_PAGES.weekly}">Edit weekly schedule</a></span></div>`;
  return shell(`
    ${pageHead(dLong(iso), slots.length ? `${plural(booked.length, 'lesson')} booked · ${plural(slots.filter(s => !s.lesson && !calSlotPast(iso, s)).length, 'open time')}${iso === TODAY ? ` · it’s ${fmtT(NOW_MIN)}` : ''}` : (iso === TODAY ? 'Today' : ''),
      `${calViewSeg(2)}<div class="btngroup"><button type="button" class="iconbtn" aria-label="Previous day"${actAttr('calDay', [-1])}>${ic('chevL', 18)}</button>${B('Today', 'secondary', 'calDayToday', { sm: true })}<button type="button" class="iconbtn" aria-label="Next day"${actAttr('calDay', [1])}>${ic('chevR', 18)}</button></div>`,
      `<a class="link" href="${href('calendar-week')}" data-act="calOpenWeek" data-arg='${esc(JSON.stringify([iso]))}'>${ic('arrowL', 14)} Week of ${dShort(weekStart(iso))}</a>`)}
    ${sp && sp.kind === 'special' ? banner('info', `Special schedule: ${esc(sp.name)}`, `${dShort(sp.sd)} – ${dShort(sp.ed)}. These times replace your weekly schedule.`) : ''}
    ${card(slots.length ? rows : empty, { pad: false, title: slots.length ? 'Every time on this day' : '', action: fut.length ? B('Cancel this day', 'danger-outline', 'calCancelDay', { sm: true, icon: 'calOff', args: [iso, 'calendar-day'] }) : '' })}`, { width: 'wide' });
};

/* ---------- Cancel preview ---------- */
SCREENS['cancel-preview'] = () => {
  const c = calUi();
  const sel = state.lessons.filter(l => c.sel.includes(l.id) && calCancellable(l));
  const backLabel = { 'calendar-week': `Week of ${dShort(c.week)}`, 'calendar-day': dLong(c.day), 'calendar-month': 'Calendar' }[c.back] || 'Back';
  if (!sel.length && !(c.weekAll && c.open.length)) return shell(`${pageHead('Nothing to cancel', 'These lessons have already started or were cancelled.', '', `<a class="link" data-act="calBack" href="#">${ic('arrowL', 14)} ${backLabel}</a>`)}`);
  const fams = families(sel.flatMap(l => skatersIn(l).map(p => student(p.sid))));
  const shared = sel.filter(isShared);
  const held = sel.filter(l => c.hold[l.id]).length;
  const open = c.weekAll ? c.open : [];
  const dates = [...sel.map(l => l.iso), ...open.map(o => o.iso)].sort();
  const span = calRange(dates[0], dates[dates.length - 1]);
  const heldBadge = badge('Held closed', 'neutral', 'lock');
  const rows = sel.map(l => row(`${avatar(initials(nameOf(l)), 'sm')}${rowTitle(esc(whoIn(l, false)) + (isShared(l) ? ' ' + badge('Shared', 'primary', 'users') : ''), `${dDow(l.iso)} · ${fmtT(l.t)} · ${l.len} min${l.recurring ? ' · this week only' : ''}${isShared(l) ? ' · both families emailed' : ''}`)}`,
    c.weekAll ? heldBadge : SEG(['Release for rebooking', 'Hold — keep closed'], c.hold[l.id] ? 1 : 0, 'calHold', [l.id]))).join('');
  const openRows = open.map(o => row(`<span class="roundicon">${ic('plus', 14)}</span>${rowTitle('Open', `${dDow(o.iso)} · ${fmtT(o.t)} · ${o.len} min`)}`, heldBadge)).join('');
  const what = c.weekAll ? `the rest of the week, ${span}` : span;
  const count = [sel.length ? plural(sel.length, 'lesson') : '', open.length ? plural(open.length, 'open time') : ''].filter(Boolean).join(' and ');
  const lead = c.weekAll ? 'Everything left this week is held closed: families can’t book these times. Your weekly schedule doesn’t change, so next week is untouched.' : 'For each lesson, choose whether families can book the time again.';
  return shell(`
    ${pageHead(`Cancel ${what}`, lead, '', `<a class="link" href="#" data-act="calBack">${ic('arrowL', 14)} ${backLabel}</a>`)}
    <div class="impact">${stat('Cancelled', plural(sel.length, 'lesson'))}${stat('Held closed', String(held + open.length))}${stat('Families emailed', String(fams.length))}</div>
    ${sel.length ? card(`<div class="tablehead"><span>Lesson</span><span>After cancelling</span></div>${rows}
      <div class="card__note">${ic('alert', 14)} A held time stays closed to families, and your schedule doesn’t change. You can’t undo a cancellation.</div>`,
      { pad: false, title: 'Lessons' }) : ''}
    ${open.length ? card(`<div class="tablehead"><span>Open time</span><span>After cancelling</span></div>${openRows}`, { pad: false, title: 'Open times' }) : ''}
    ${fams.length ? help('Who gets told', `${fams.map(esc).join(', ')} will each get one email listing their cancelled ${sel.length === 1 ? 'lesson' : 'lessons'}, with a link to book another time. Repeating lessons in other weeks aren’t affected.${shared.length ? ` A shared lesson is cancelled for every skater in it, and each skater’s family gets its own email.` : ''}`) : ''}
    <div class="stickybar">${B('Back', 'secondary', 'calBack')}<span class="stickybar__note">${plural(fams.length, 'family', 'families')} will be emailed. Nothing changes until you confirm.</span>${B(c.weekAll ? `Cancel ${count}` : `Cancel ${plural(sel.length, 'lesson')}`, 'danger', 'calAccept', { lg: true })}</div>`);
};

/* BladeBook coach website — Lessons, Payments, Financial summary, Profile and Email templates (Phase 2).
   Registers into SCREENS, ACTIONS, MODALS and PRESETS from app.js. UI state lives under
   state.ui.lessons, state.ui.pay, state.ui.fin, state.ui.prof and state.ui.tpl.
   Lessons and Payments list one row per skater: a shared lesson has a row for each, with their own attendance and
   payment (ADR-026 d6). Actions take the lesson id and k (-1 for the booking skater, else the index in l.with). */

/* ================= shared bits ================= */
const mpHappened = (from, to) => state.lessons.filter(l => l.sid && isPast(l) && l.iso >= from && l.iso <= to).flatMap(skatersIn);
const mpEmpty = (icon, title, body) =>
  `<div class="mp-empty"><span class="mp-empty__icon">${ic(icon, 22)}</span><b>${title}</b><span class="muted">${body}</span></div>`;
/** Range check: '' when fine, else an error message. */
const mpRangeError = (from, to) => (from && to && from > to) ? 'The end date is before the start date.' : '';
const mpRangeBar = (fromPath, toPath, idp, extra = '') => {
  const err = mpRangeError(getPath(fromPath), getPath(toPath));
  return `<div class="filters mp-filters">${INP(idp + '-from', 'From', fromPath, { type: 'date', live: true })}${INP(idp + '-to', 'To', toPath, { type: 'date', live: true, error: err || '' })}${extra}</div>`;
};
const PAY_BADGE = { PAID: ['Paid', 'success', 'check'], WAIVED: ['Waived', 'neutral'], UNPAID: ['Unpaid', 'warning'] };
const payBadge = l => { const [t, v, i] = PAY_BADGE[l.pay]; return badge(t, v, i); };
const mpLesson = id => state.lessons.find(l => l.id === id);
/** The object holding one skater's attendance and payment: the lesson itself (k = -1) or its entry in l.with. */
const mpPart = (id, k = -1) => { const l = mpLesson(id); return !l ? null : k < 0 ? l : (l.with || [])[k] || null; };
const mpSharedWith = p => isShared(p.lesson) ? `<small class="mp-sub">${ic('users', 12)} Shared with ${skatersIn(p.lesson).filter(x => x.sid !== p.sid).map(x => esc(shortName(student(x.sid).name))).join(', ')}</small>` : '';
/** How-paid choices: the payment types the coach takes, plus Other (ADR-003 d4). A stored value whose type was later
   switched off is kept as a choice, so editing never loses it. */
const mpHowOpts = part => { const o = payTypesFor(state.profile); return part && part.paidBy && !o.some(([v]) => v === part.paidBy) ? [...o.slice(0, -1), [part.paidBy, PAID_BY_LABEL[part.paidBy]], o[o.length - 1]] : o; };

/* ================= Lessons — attendance corrections ================= */
SCREENS.lessons = () => {
  const ui = (state.ui.lessons ??= { from: '', to: '' });
  const ready = ui.from && ui.to && !mpRangeError(ui.from, ui.to);
  let body;
  if (!ready) {
    body = card(mpEmpty('calendar', 'Pick a date range', 'Choose a start and end date to see the lessons in it.'));
  } else {
    const list = mpHappened(ui.from, ui.to);
    const nr = list.filter(l => statusOf(l) === 'NOT_RECORDED');
    const att = list.filter(l => l.status === 'CHECKED_IN').length, ns = list.filter(l => l.status === 'NO_SHOW').length;
    const rows = list.map(l => {
      const s = student(l.sid), st = statusOf(l);
      const on = l.status === 'CHECKED_IN' ? 0 : l.status === 'NO_SHOW' ? 1 : -1;
      return row(`${avatar(initials(s.name), 'sm')}<div>${rowTitle(`${esc(s.name)}${st === 'NOT_RECORDED' ? ' ' + badge('Not recorded', 'warning', 'alert') : ''}`,
        `${dDow(l.iso)} · ${fmtT(l.t)} · ${l.len} min${s.rel !== 'Self' ? ' · ' + esc(s.client) : ''}`)}${mpSharedWith(l)}</div>`,
        SEG(['Attended', 'No-show'], on, 'mpAttend', [l.id, l.k]), { cls: st === 'NOT_RECORDED' ? 'row--attn' : '' });
    }).join('');
    body = `

/* ================= Financial summary (MVP feature 16) =================
   Gross is money received: lessons marked paid, plus missed-lesson fees actually collected (a no-show marked paid).
   Waived and unpaid lessons are left out; the year is the calendar year (Open-Pending §3, settled 2026-10-12).
   BladeBook calculates rink fees, but how is open (docs/Q_Rink-Fees.md). Each rink's terms are added by the developer when
   BladeBook reaches that rink, and the coach can't change them or enter what they paid (owner, 2026-10-12: B18, B19).
   This page shows one reading of the rest: figure skating is 15% of each month's gross or $500 a month, the coach's
   choice (Kim Q1–2), and a lesson counts in the month it was taught (Q6). */
const FIN_YEAR = TODAY.slice(0, 4);
const FIN_TERMS = { percent: 0.15, flat: 500, hockeyHour: 10 };
const finMonths = () => {
  const out = [];
  for (let m = 0; m <= parseIso(TODAY).getMonth(); m++) {
    const ym = `${FIN_YEAR}-${String(m + 1).padStart(2, '0')}`;
    const parts = state.lessons.filter(l => l.sid && l.iso.startsWith(ym) && isPast(l)).flatMap(skatersIn);
    const paid = parts.filter(p => p.pay === 'PAID');
    const gross = paid.reduce((s, p) => s + p.price, 0);
    const calc = !parts.length ? 0 : state.profile.rinkPlan === 'flat' ? FIN_TERMS.flat : Math.round(gross * FIN_TERMS.percent);
    out.push({ ym, m, parts, paid, gross, fee: calc, unpaid: parts.filter(p => p.pay === 'UNPAID').reduce((s, p) => s + p.price, 0), waived: parts.filter(p => p.pay === 'WAIVED').reduce((s, p) => s + p.price, 0) });
  }
  return out;
};

/* A coach code is 8 random characters from a set with no look-alikes (no 0, O, 1, I, L, 5, S, U), shown 4-dash-4.
   No part of the coach's name; it never expires on its own (ADR-002, amended 2026-10-13). */
const MP_CODE_CHARS = 'ABCDEFGHJKMNPQRTVWXYZ2346789';
Object.assign(ACTIONS, {
  mpSave() { state.flash = 'Saved.'; },
  mpToggle(key) { state.profile[key] = !state.profile[key]; },
  payTypeToggle(k) {
    const p = state.profile, [, label, h] = PAY_TYPES.find(t => t[3] === k), kept = (p.payKept ??= {});
    if (p[k]) { p[k] = false; if (h && p[h]) kept[k] = true; return; }
    if (h && !p[h]) { state.flash = `Add your ${label} handle first.`; return; }
    if (h && kept[k]) { state.modal = { kind: 'payVerify', k }; return; }
    p[k] = true;
  },
  payVerifyOk() {
    const k = state.modal.k, p = state.profile, [, label, h] = PAY_TYPES.find(t => t[3] === k);
    if (!p[h]) { state.flash = `Add your ${label} handle first.`; return; }
    p[k] = true; delete p.payKept[k]; state.modal = null; state.flash = `${label} switched on.`;
  },
  mpPhotoRemove() { state.profile.photo = false; },
  mpRotateAsk() { state.modal = { kind: 'mpRotate' }; },
  mpRotate() {
    const p = state.profile, old = p.code;
    let s = ''; for (let i = 0; i < 8; i++) s += MP_CODE_CHARS[(hash(old + i + s) + i * 7) % MP_CODE_CHARS.length];
    p.code = s.slice(0, 4) + '-' + s.slice(4);
    state.modal = null; state.flash = `New code: ${p.code}. ${old} no longer works for new sign-ups.`;
  },
  mpPickEmail(i) { const e = state.profile.emails[i]; if (e && !e.pending) state.profile.businessEmail = e.addr; },
  mpRemoveEmail(i) { const p = state.profile, e = p.emails[i]; if (!e || e.addr === p.businessEmail || e.addr === p.loginEmail) return; p.emails.splice(i, 1); },
  mpAddStart() { const ui = (state.ui.prof ??= {}); ui.adding = true; ui.newEmail = ''; ui.emailErr = ''; },
  mpAddCancel() { const ui = state.ui.prof; ui.adding = false; ui.emailErr = ''; },
  mpAddEmail() {
    const ui = state.ui.prof, a = (ui.newEmail || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a)) { ui.emailErr = 'Enter an email address like you@example.com.'; return; }
    if (state.profile.emails.some(e => e.addr === a)) { ui.emailErr = 'That address is already on your list.'; return; }
    state.profile.emails.push({ addr: a, pending: true }); ui.adding = false; ui.emailErr = '';
    state.flash = `Confirmation link sent to ${a}.`;
  },
  mpConfirmEmail(i) { const e = state.profile.emails[i]; if (e) { delete e.pending; state.flash = `${e.addr} is confirmed. Choose it to make it your business email.`; } },
  mpPwOpen() { const ui = (state.ui.prof ??= {}); ui.pwCur = ''; ui.pwNew = ''; state.modal = { kind: 'mpPassword' }; },
  mpPwSave() { state.modal = null; state.flash = 'Password changed.'; },
});
