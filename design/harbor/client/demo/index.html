<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grace Chen · BladeBook family demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* BladeBook — Harbor theme. Tokens on :root, the shared component layer, and the form-control,
   demo and responsive layers. Taken from design/redesign/harbor-schedule-creator-demo.html
   (2026-10-01), which carries the WCAG-AA-checked Harbor tokens. Wrap pages in
   <div class="bb" data-layout="top">. Harbor is light-only by design. */

/* Layout: Harbor coach app — centred pill nav, page column, sticky action bar.
   Tokens: Harbor theme (teal + coral on sand), WCAG AA checked. Harbor is a light-only look, so it stays the same in dark mode. */
:root {
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --w-reg: 400; --w-med: 500; --w-bold: 700; --w-head: 800; --h1: 28px; --track-head: -0.02em;
  --bg: #F7F3EC; --surface: #FFFDF9; --surface-2: #F2ECE2; --border: #E7DFD2; --border-strong: #8C826E;
  --text: #1E292D; --text-2: #46524F; --text-3: #5F6966; --text-4: #6E7672; --link: #0E6C68;
  --primary: #0E6C68; --on-primary: #FFFFFF; --primary-soft: #D4EBE8; --primary-soft-text: #0A5350; --primary-tint: #EFF7F5; --primary-border: #87C2BC; --primary-text: #0E6C68;
  --focus-ring: rgba(14, 108, 104, .25); --accent: #C2513A; --on-accent: #FFFFFF;
  --success: #2C7A4B; --on-success: #FFFFFF; --success-soft: #E5F2E8; --success-border: #ADD4B8; --success-text: #215F3A;
  --warning: #B4650B; --warning-soft: #FCEFD9; --warning-border: #EDC98C; --warning-text: #874B07;
  --danger: #C2412B; --on-danger: #FFFFFF; --danger-soft: #FCEBE6; --danger-border: #F0B7AA; --danger-text: #97301F;
  --info: #0E6C68; --info-soft: #EFF7F5; --info-border: #BEDDD9;
  --alt-soft: #FBE7E1; --alt-text: #A8432D;
  --disabled-bg: #ECE6DB; --disabled-text: #7C837F;
  --r-sm: 12px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px; --r-mark: 50%; --r-btn: 999px; --r-input: 12px;
  --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 4px 14px -6px rgba(60, 45, 20, .08); --shadow-lg: 0 14px 34px -12px rgba(60, 45, 20, .25);
  --nav-bg: #FFFDF9; --nav-text: #5C6764; --nav-text-strong: #1E292D; --nav-active-bg: #0E6C68; --nav-active-text: #FFFFFF;
  --avatar-bg: #FBE7E1; --avatar-text: #A8432D; --card-border: #EDE6DA; --scrim: rgba(20, 25, 25, .45);
  --demo-bg: #0E6C68; --demo-text: #FFFFFF; color-scheme: light;
}
html, body { margin: 0; background: var(--bg); color: var(--text); }
/* ============ BladeBook component layer ============
   Everything here reads theme tokens. Themes (themes.css) only set tokens
   plus a handful of signature overrides. */
.bb { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-feature-settings: var(--font-features, normal); text-align: left; }
.bb *, .bb *::before, .bb *::after { box-sizing: border-box; }
.bb h1, .bb h2, .bb p { margin: 0; }
.bb button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.bb b { font-weight: var(--w-bold); }
.bb .ic { flex: none; display: block; }
.bb .num, .bb .money, .bb .mono, .bb .stat__value, .bb .slot__time, .bb .wslot, .bb .wl__t, .bb .rl__time, .bb .dchip__n, .bb .cal__num, .bb .delta, .bb .total__v, .bb .codecard__code, .bb .otp__box { font-variant-numeric: tabular-nums; }
.bb .mono { letter-spacing: .04em; }
.bb .center { text-align: center; }
.bb .link { color: var(--link); font-weight: var(--w-med); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.bb .link--danger { color: var(--danger); font-size: 13px; }
.bb .muted, .bb .muted-sm { color: var(--text-3); }
.bb .muted-sm { font-size: 12px; font-weight: var(--w-med); }
.bb .hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

/* ---- type ---- */
.bb .h1 { font-size: var(--h1, 26px); font-weight: var(--w-head); letter-spacing: var(--track-head, -0.02em); line-height: 1.2; color: var(--text); }
.bb .h2 { font-size: 16px; font-weight: var(--w-bold); letter-spacing: -0.01em; line-height: 1.3; }
.bb .lede { color: var(--text-2); font-size: 15px; margin-top: 6px; }
.bb .eyebrow { font-size: 11.5px; font-weight: var(--w-bold); text-transform: var(--eyebrow-case, uppercase); letter-spacing: var(--eyebrow-track, .08em); color: var(--text-3); }
.bb .fine { font-size: 13px; color: var(--text-3); }
.bb .crumb { margin-bottom: 8px; font-size: 13px; }

/* ---- app shell (top layout default) ---- */
.bb .app { position: relative; min-height: 820px; display: flex; flex-direction: column; background: var(--bg); }
.bb .nav { display: flex; align-items: center; gap: 28px; padding: 0 32px; height: 64px; background: var(--nav-bg); color: var(--nav-text); border-bottom: 1px solid var(--nav-border, var(--border)); flex: none; }
.bb .brand { display: flex; align-items: center; gap: 10px; font-weight: var(--w-head); font-size: 17px; letter-spacing: -0.02em; color: var(--brand-text, var(--nav-text-strong, var(--text))); }
.bb .brand__mark { width: 32px; height: 32px; border-radius: var(--r-mark, 9px); background: var(--brand-mark-bg, var(--primary)); color: var(--brand-mark-fg, var(--on-primary)); display: grid; place-items: center; }
.bb .nav__items { display: flex; gap: 4px; flex: 1; }
.bb .nav__item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-sm); color: var(--nav-text); font-weight: var(--w-med); font-size: 14px; cursor: pointer; position: relative; }
.bb .nav__item .ic { width: 16px; height: 16px; opacity: .8; }
.bb .nav__item.is-active { color: var(--nav-active-text); background: var(--nav-active-bg); }
.bb .nav__item.is-active .ic { opacity: 1; }
.bb .nav__user { display: flex; align-items: center; gap: 10px; }
.bb .nav__user-text { display: flex; flex-direction: column; line-height: 1.2; }
.bb .nav__user-text b { font-size: 13px; color: var(--nav-text-strong, var(--text)); }
.bb .nav__user-text small { font-size: 12px; color: var(--nav-text); }
.bb .main { flex: 1; padding: 32px; }
.bb .page { margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.bb .page--narrow { max-width: 760px; }
.bb .page--wide { max-width: 1120px; }
.bb .page--full { max-width: none; }

/* ---- side layout ---- */
.bb[data-layout="side"] .app:not(.app--wizard) { flex-direction: row; }
.bb[data-layout="side"] .nav { flex-direction: column; align-items: stretch; width: 240px; height: auto; padding: 20px 14px; gap: 24px; border-bottom: 0; border-right: 1px solid var(--nav-border, var(--border)); }
.bb[data-layout="side"] .nav .brand { padding: 0 8px; }
.bb[data-layout="side"] .nav__items { flex-direction: column; gap: 2px; }
.bb[data-layout="side"] .nav__item { padding: 10px 12px; }
.bb[data-layout="side"] .nav__item .ic { width: 18px; height: 18px; }
.bb[data-layout="side"] .nav__user { padding: 12px 8px 0; border-top: 1px solid var(--nav-border, var(--border)); }
.bb[data-layout="side"] .main { padding: 32px 40px; }

/* ---- wizard shell ---- */
.bb .app--wizard { min-height: 880px; }
.bb .wbar { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 32px; background: var(--wbar-bg, var(--surface)); border-bottom: 1px solid var(--border); }
.bb .wbar__ctx { color: var(--text-3); font-size: 14px; padding-left: 14px; border-left: 1px solid var(--border); }
.bb .wbar__right { margin-left: auto; font-size: 14px; color: var(--text-2); display: flex; gap: 6px; }
.bb .wmain { padding: 32px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
.bb .wgrid { display: grid; grid-template-columns: 560px 300px; gap: 28px; align-items: start; }
.bb .wcol { display: flex; flex-direction: column; gap: 16px; }
.bb .wcol > .card > .card__body { padding: 32px; gap: 18px; }

/* stepper */
.bb .stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.bb .step { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-3); font-weight: var(--w-med); }
.bb .step__dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: var(--w-bold); border: 1.5px solid var(--border-strong); color: var(--text-3); background: var(--surface); }
.bb .step--current { color: var(--text); }
.bb .step--current .step__dot { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.bb .step--done { color: var(--text-2); }
.bb .step--done .step__dot { background: var(--primary-soft); border-color: transparent; color: var(--primary-soft-text); }
.bb .step__line { width: 36px; height: 1.5px; background: var(--border); list-style: none; }

/* ---- surfaces ---- */
.bb .card { background: var(--surface); border: 1px solid var(--card-border, var(--border)); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.bb .card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 22px 0; }
.bb .card--flush .card__head { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.bb .card__sub { color: var(--text-3); font-size: 13px; margin-top: 3px; }
.bb .card__body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.bb .card--flush .card__body { padding: 0; gap: 0; }
.bb .card__note { display: flex; gap: 8px; align-items: flex-start; padding: 14px 22px; font-size: 13px; color: var(--text-3); background: var(--surface-2); border-top: 1px solid var(--border); }
.bb .card__note .ic { margin-top: 2px; }
.bb .card--center .card__body { align-items: stretch; }
.bb .card--accent { border-color: var(--primary-border, var(--primary)); box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow); }
.bb .card--attn { border-color: var(--warning-border); background: var(--warning-soft); }
.bb .stack { display: flex; flex-direction: column; gap: 16px; }
.bb .sticky { position: sticky; top: 0; }
.bb .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bb .grid2--wide { grid-template-columns: 1fr auto; align-items: end; }
.bb .grid3 { display: grid; grid-template-columns: 1.3fr .8fr 1fr; gap: 14px; align-items: start; }
.bb .split { display: grid; gap: 20px; align-items: start; }
.bb .split--cal { grid-template-columns: 1fr 300px; }
.bb .split--tl { grid-template-columns: 1fr 340px; }
.bb .split--even { grid-template-columns: 1fr 1fr; }
.bb .split--sched { grid-template-columns: 400px 1fr; }

.bb .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
.bb .phead__actions { display: flex; gap: 10px; align-items: center; }

/* ---- buttons ---- */
.bb .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-btn, var(--r-sm)); font-weight: var(--w-bold); font-size: 14px; white-space: nowrap; border: 1px solid transparent; transition: background .15s; }
.bb .btn--lg { height: 48px; padding: 0 22px; font-size: 15px; }
.bb .btn--sm { height: 32px; padding: 0 12px; font-size: 13px; }
.bb .btn--block { width: 100%; }
.bb .btn--primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--btn-shadow, none); }
.bb .btn--secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.bb .btn--ghost { color: var(--text-2); }
.bb .btn--danger { background: var(--danger); color: #fff; }
.bb .btn--danger-outline { background: var(--surface); color: var(--danger); border-color: var(--danger-border); }
.bb .btn[disabled] { background: var(--disabled-bg); color: var(--disabled-text); border-color: transparent; box-shadow: none; cursor: not-allowed; }
.bb .iconbtn { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); flex: none; }
.bb .iconbtn--sm { width: 30px; height: 30px; border-color: transparent; background: transparent; }
.bb .btngroup { display: flex; gap: 6px; align-items: center; }
.bb .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bb .actions__r { display: flex; gap: 10px; }
.bb .stickybar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
.bb .stickybar__note { flex: 1; text-align: right; color: var(--text-3); font-size: 13px; }

/* ---- form ---- */
.bb .field, .bb .fieldset { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.bb .label { font-size: 13px; font-weight: var(--w-bold); color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.bb .label__opt { font-weight: var(--w-reg); color: var(--text-3); font-size: 12px; }
.bb .input { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid var(--input-border, var(--border-strong)); border-radius: var(--r-input, var(--r-sm)); background: var(--input-bg, var(--surface)); font-size: 15px; color: var(--text); }
.bb .input.is-focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.bb .input.is-placeholder .input__val { color: var(--text-3); }
.bb .input--mono .input__val { letter-spacing: .08em; font-weight: var(--w-med); }
.bb .input--readonly { background: var(--surface-2); justify-content: space-between; }
.bb .input__val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb .input__affix { color: var(--text-3); font-size: 14px; }
.bb .input__lead, .bb .input__chev { color: var(--text-3); }
.bb .input__ok { width: 22px; height: 22px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; }
.bb .field--error .input { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.bb .hint { font-size: 12.5px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
.bb .hint--error { color: var(--danger); }
.bb .rules { list-style: none; margin: -4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-3); }
.bb .rules li { display: flex; align-items: center; gap: 5px; }
.bb .rules li.is-ok { color: var(--success-text); }

.bb .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--seg-bg, var(--surface-2)); border: 1px solid var(--border); border-radius: var(--r-sm); }
.bb .seg--block { display: flex; }
.bb .seg--block .seg__opt { flex: 1; }
.bb .seg__opt { padding: 7px 12px; border-radius: calc(var(--r-sm) - 3px); font-size: 13px; font-weight: var(--w-med); color: var(--text-2); text-align: center; white-space: nowrap; cursor: pointer; }
.bb .seg__opt.is-on { background: var(--seg-on-bg, var(--surface)); color: var(--seg-on-text, var(--text)); box-shadow: var(--seg-on-shadow, 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border)); font-weight: var(--w-bold); }

.bb .check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.bb .check__box { width: 20px; height: 20px; flex: none; border-radius: 5px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; background: var(--surface); margin-top: 1px; }
.bb .check__box.is-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.bb .check__text { display: flex; flex-direction: column; gap: 3px; }
.bb .check__label { font-weight: var(--w-bold); font-size: 14px; }
.bb .check__sub { font-size: 12.5px; color: var(--text-3); }

.bb .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 22px; border-bottom: 1px solid var(--border); }
.bb .card__body > .toggle-row:first-child { padding-top: 0; }
.bb .card:not(.card--flush) .toggle-row { padding: 0 0 14px; }
.bb .toggle-row__label { font-weight: var(--w-bold); }
.bb .toggle-row__sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.bb .switch { width: 40px; height: 24px; border-radius: 999px; background: var(--switch-off, var(--border-strong)); position: relative; flex: none; }
.bb .switch__knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.bb .switch.is-on { background: var(--primary); }
.bb .switch.is-on .switch__knob { left: 19px; }

.bb .rcard { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.bb .rcard.is-on { border-color: var(--primary); background: var(--primary-tint); box-shadow: 0 0 0 1px var(--primary); }
.bb .rcard__icon { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; flex: none; }
.bb .rcard.is-on .rcard__icon { background: var(--primary-soft); color: var(--primary-soft-text); }
.bb .rcard__text { flex: 1; min-width: 0; }
.bb .rcard__title { font-weight: var(--w-bold); }
.bb .rcard__sub { font-size: 13px; color: var(--text-3); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.bb .radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex: none; background: var(--surface); }
.bb .radio.is-on { border: 6px solid var(--primary); }
.bb .inline-select { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text); font-weight: var(--w-bold); }

.bb .days { display: flex; gap: 6px; }
.bb .day { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; border: 1px solid var(--border-strong); font-weight: var(--w-bold); font-size: 13px; color: var(--text-2); position: relative; background: var(--surface); }
.bb .day.is-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.bb .day.has-other::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
.bb .day.is-on.has-other::after { background: var(--on-primary); }

.bb .otp { display: flex; gap: 10px; justify-content: center; }
.bb .otp__box { width: 50px; height: 58px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 24px; font-weight: var(--w-bold); background: var(--surface); }
.bb .otp__box.is-focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }

/* ---- feedback ---- */
.bb .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: var(--r-md); border: 1px solid; font-size: 14px; }
.bb .banner__icon { margin-top: 1px; }
.bb .banner__title { font-weight: var(--w-bold); }
.bb .banner__body { color: var(--text-2); }
.bb .banner__title + .banner__body { margin-top: 2px; }
.bb .banner--success { background: var(--success-soft); border-color: var(--success-border); } .bb .banner--success .banner__icon { color: var(--success); }
.bb .banner--warning { background: var(--warning-soft); border-color: var(--warning-border); } .bb .banner--warning .banner__icon { color: var(--warning); }
.bb .banner--danger { background: var(--danger-soft); border-color: var(--danger-border); } .bb .banner--danger .banner__icon { color: var(--danger); } .bb .banner--danger .banner__title { color: var(--danger-text); }
.bb .banner--info { background: var(--info-soft); border-color: var(--info-border); } .bb .banner--info .banner__icon { color: var(--info); }

.bb .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-badge, 999px); font-size: 12px; font-weight: var(--w-bold); white-space: nowrap; vertical-align: middle; line-height: 1.3; }
.bb .badge--neutral { background: var(--surface-2); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
.bb .badge--primary { background: var(--primary-soft); color: var(--primary-soft-text); }
.bb .badge--success { background: var(--success-soft); color: var(--success-text); }
.bb .badge--warning { background: var(--warning-soft); color: var(--warning-text); }
.bb .badge--danger { background: var(--danger-soft); color: var(--danger-text); }

.bb .help { background: var(--help-bg, var(--surface-2)); border: 1px solid var(--help-border, transparent); border-radius: var(--r-lg); padding: 18px 20px; font-size: 13.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
.bb .help__title { display: flex; align-items: center; gap: 8px; font-weight: var(--w-bold); color: var(--text); }
.bb .help__title .ic { color: var(--primary); }
.bb .help__body p + p { margin-top: 8px; }
.bb .numlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.bb .numlist small { color: var(--text-3); }

/* schedule creator */

.bb .wkbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.bb button.cal__cell { font: inherit; color: inherit; text-align: left; width: 100%; }

@media (max-width: 980px) { .bb .bk-split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .bb .tl { grid-template-columns: minmax(0, 1fr); }

}
/* Many coaches (ADR-025): the coach dropdown, picks grouped by coach, and clashes with another coach's lessons. */
.bb .bk-pickers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }

.bb .bk-pick--clash { box-shadow: inset 3px 0 0 var(--warning); }

.bb .bk-dlist + .bk-dlist__h { margin-top: 14px; }
.bb .bk-clashes { display: flex; flex-direction: column; gap: 8px; text-align: left; }

.bb .total:has(.bk-total-note) { flex-wrap: wrap; gap: 4px 12px; }

.bb .slot.bk-clash .slot__time { white-space: nowrap; }
.bb .dialog > * { flex-shrink: 0; }

.bb .bk-rescoach { display: flex; align-items: center; gap: 12px; margin: 8px 0 -4px; }
.bb .bk-rescoach > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.bb .bk-rescoach span { font-size: 13px; color: var(--text-3); }

<script>

const ICONS = {

  wifiOff: '<path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  calOff: '<path d="M4.18 4.18A2 2 0 0 0 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 1.82-1.18M21 15.5V6a2 2 0 0 0-2-2H9.5M3 10h7M21 10h-5.5M16 2v4M8 2v4M2 2l20 20"/>',

  ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',

const ic = (n, s = 16, cls = '') =>
  `<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- primitives ---------- */
const btn = (label, v = 'primary', o = {}) =>
  `<button class="btn btn--${v}${o.block ? ' btn--block' : ''}${o.lg ? ' btn--lg' : ''}${o.sm ? ' btn--sm' : ''}"${o.disabled ? ' disabled' : ''}>${o.icon ? ic(o.icon, o.sm ? 14 : 16) : ''}<span>${label}</span>${o.iconR ? ic(o.iconR, 16) : ''}</button>`;
const badge = (t, v = 'neutral', icon) => `<span class="badge badge--${v}">${icon ? ic(icon, 12) : ''}${t}</span>`;
const banner = (v, title, body = '', icon) => {
  const i = icon || { success: 'check', warning: 'alert', danger: 'alert', info: 'info' }[v];
  return `<div class="banner banner--${v}"><span class="banner__icon">${ic(i, 18)}</span><div class="banner__text">${title ? `<div class="banner__title">${title}</div>` : ''}${body ? `<div class="banner__body">${body}</div>` : ''}</div></div>`;
};
const field = (label, value, o = {}) => `
  <div class="field${o.error ? ' field--error' : ''}">
    <label class="label">${label}${o.optional ? ' <span class="label__opt">Optional</span>' : ''}</label>
    <div class="input${o.area ? ' input--area' : ''}${o.select ? ' input--select' : ''}${o.focus ? ' is-focus' : ''}${o.placeholder ? ' is-placeholder' : ''}${o.mono ? ' input--mono' : ''}">
      ${o.prefix ? `<span class="input__affix">${o.prefix}</span>` : ''}${o.lead ? ic(o.lead, 16, 'input__lead') : ''}
      <span class="input__val">${value}</span>
      ${o.suffix ? `<span class="input__affix">${o.suffix}</span>` : ''}${o.select ? ic('chevD', 16, 'input__chev') : ''}${o.ok ? `<span class="input__ok">${ic('check', 14)}</span>` : ''}
    </div>
    ${o.hint ? `<div class="hint${o.error ? ' hint--error' : ''}">${o.error ? ic('alert', 14) : ''}${o.hint}</div>` : ''}
  </div>`;
const seg = (opts, active, o = {}) =>
  `<div class="seg${o.block ? ' seg--block' : ''}">${opts.map((x, i) => `<span class="seg__opt${i === active ? ' is-on' : ''}">${x}</span>`).join('')}</div>`;
const check = (label, on, sub = '') =>

const toggle = (label, on, sub = '') =>
  `<div class="toggle-row"><div class="toggle-row__text"><div class="toggle-row__label">${label}</div>${sub ? `<div class="toggle-row__sub">${sub}</div>` : ''}</div><span class="switch${on ? ' is-on' : ''}"><span class="switch__knob"></span></span></div>`;
const radioCard = (title, sub, on, icon) =>
  `<div class="rcard${on ? ' is-on' : ''}">${icon ? `<span class="rcard__icon">${ic(icon, 20)}</span>` : ''}<div class="rcard__text"><div class="rcard__title">${title}</div>${sub ? `<div class="rcard__sub">${sub}</div>` : ''}</div><span class="radio${on ? ' is-on' : ''}"></span></div>`;

const eyebrow = t => `<div class="eyebrow">${t}</div>`;
const pageHead = (title, sub = '', actions = '', crumb = '') =>

const row = (left, right = '', o = {}) =>
  `<div class="row${o.muted ? ' row--muted' : ''}${o.cls ? ' ' + o.cls : ''}"><div class="row__main">${left}</div>${right ? `<div class="row__side">${right}</div>` : ''}</div>`;

function stepper(steps, cur) {
  return `<ol class="stepper">${steps.map((s, i) => {
    const st = i < cur ? 'done' : i === cur ? 'current' : 'todo';
    return `<li class="step step--${st}"><span class="step__dot">${st === 'done' ? ic('check', 13) : i + 1}</span><span class="step__label">${s}</span></li>`;
  }).join('<li class="step__line" aria-hidden="true"></li>')}</ol>`;
}
function wizard(ctx, steps, cur, main, aside) {

/* ---------- data ---------- */
function monthGrid(year, month, cellFn, o = {}) {
  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal__cell cal__cell--pad"></div>';
  for (let d = 1; d <= days; d++) cells += cellFn(d, (first + d - 1) % 7);
  return `<div class="cal${o.cls ? ' ' + o.cls : ''}"><div class="cal__dow">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<span>${x}</span>`).join('')}</div><div class="cal__grid">${cells}</div></div>`;
}

    `<div class="stack">${coachChip()}${help(self ? 'Skating yourself' : 'Signing up for your child?', self ? 'Reminders, confirmations and payment reminders all come to you.' : 'Sign up as yourself. You add your child as a skater on step 4, and you can add more than one.')}</div>`,
    { steps: 1, ctx: 'Family sign up', right });

  if (u.step === 2) return authShell(card(`
    <div class="mailicon">${ic('mail', 26)}</div>
    <h1 class="h1 center">Check your email</h1><p class="lede center">We sent a 6-digit code to <b>${esc(u.email)}</b>.<br>It expires in 24 hours.</p>
    ${codeBoxes(['4', '8', '2', '9', '', ''])}
    ${B('Verify email', 'primary', 'acSuNext', { block: true, lg: true })}
    <p class="fine center"><a class="link" data-act="noop">Resend code</a> · <a class="link" data-act="acSuBack">Use a different email</a></p>`, { cls: 'card--center' }),
    help('Why a code?', 'It proves the email is yours before lesson reminders go there. Can’t find it? Check spam for “Your verification code” from BladeBook.'),

  if (u.step === 3) {
    if (self) return authShell(card(`
      <h1 class="h1">You’re the skater</h1><p class="lede">Check your details. This is who ${who} will see.</p>
      <div class="skater">${avatar(initials(`${u.first} ${u.last}`))}<div class="skater__text"><b>${esc(u.first)} ${esc(u.last)} ${badge('You', 'primary')}</b><small>Adult · from your account details</small></div></div>
      ${CHK('I’m 18 or older', !!u.selfAdult, 'acSuSelfAdult', [], 'If you’re under 18, a guardian needs to sign up and add you as their skater.')}
      ${skaterOrgFields('ui.su', 'selfOrg', 'selfNum', 'ac-su-self-num', 'acSuSelfOrg')}
      ${suCoachPick(ids, suSel(u, 'selfCoaches'), 'acSuSelfCoach')}
      <p class="fine">Booking for someone else? <a class="link" data-act="acSuChangeWho">Change who the lessons are for</a>.</p>
      <div class="actions"><div>${B('Back', 'ghost', 'acSuBack', { icon: 'arrowL' })}</div><div class="actions__r">${B(multi ? 'Send to your coaches' : `Send to ${who}`, 'primary', 'acSuFinish', { lg: true, iconR: 'arrowR', disabled: !u.selfAdult || !acNumOk(u.selfOrg, u.selfNum) || !suSel(u, 'selfCoaches').length })}</div></div>`),
      `<div class="stack">${help('Skating yourself', `${multi ? 'Each coach' : who} still approves you before you can book with them. Booking opens here as soon as they do.`)}${help('Your skater number', 'Every skater needs a current U.S. Figure Skating, USA Hockey or Learn to Skate USA number to sign up. BladeBook can’t check it; your coach may.')}</div>`,
      { steps: 3, ctx: 'Family sign up', right: '' });
    const list = u.skaters.map((s, i) => `<div class="skater">${avatar(initials(s.name))}<div class="skater__text"><b>${esc(s.name)}</b><small>Under 18 · your child · ${orgLine(s)}${multi ? ` · ${coachOr((s.coaches || ids).filter(id => ids.includes(id)), 'and')}` : ''}</small></div>${B('Remove', 'ghost', 'acSuDropSkater', { sm: true, args: [i] })}</div>`).join('');
    return authShell(card(`
      <h1 class="h1">Who’s skating?</h1><p class="lede">Add everyone who will take lessons with ${who}.</p>
      ${list || `<p class="fine">No skaters yet. Add at least one.</p>`}
      <div class="skater skater--edit">
        ${INP('ac-su-skater', 'Skater’s full name', 'ui.su.draft', { placeholder: 'e.g. Ava Park', hint: 'Children under 18. A skater 18 or older signs up for their own account.' })}
        ${skaterOrgFields('ui.su', 'draftOrg', 'draftNum', 'ac-su-skater-num', 'acSuDraftOrg')}
        ${suCoachPick(ids, suSel(u, 'draftCoaches'), 'acSuDraftCoach')}
        <div class="skater__actions">${B(u.skaters.length ? 'Add another skater' : 'Add skater', 'secondary', 'acSuAddSkater', { sm: true, icon: 'plus', disabled: !u.draft.trim() || !acNumOk(u.draftOrg, u.draftNum) || !suSel(u, 'draftCoaches').length })}</div>
      </div>
      <div class="actions"><div>${B('Back', 'ghost', 'acSuBack', { icon: 'arrowL' })}</div><div class="actions__r">${B(multi ? 'Send to your coaches' : `Send to ${who}`, 'primary', 'acSuFinish', { lg: true, iconR: 'arrowR', disabled: !u.skaters.length })}</div></div>`),
      `<div class="stack">${help('What happens next', `${multi ? 'Each coach approves the skaters who chose them' : `${who} approves each skater`} before they can be booked. You can add more skaters and coaches later from your profile.`)}${help('Skater numbers', 'Every skater needs a current U.S. Figure Skating, USA Hockey or Learn to Skate USA number to sign up. BladeBook can’t check it; your coach may.')}</div>`,
      { steps: 3, ctx: 'Family sign up', right: '' });
  }

  const kids = (u.done || []).map(d => typeof d === 'string' ? { name: d, coaches: ids } : d);
  return authShell(card(`
    <div class="hero hero--success hero--stack"><span class="hero__icon">${ic('check', 26)}</span><div><h1 class="h1">You’re in</h1><p class="lede">Signed in as ${esc(u.email)}. One thing left: ${multi ? 'each coach’s approval' : `${who}’s approval`}.</p></div></div>
    <div class="listbox">${kids.map(k => row(`${avatar(initials(k.name), 'sm')}${rowTitle(esc(k.name), `with ${coachOr(k.coaches, 'and')}`)}`, `<span class="ac-kc__list">${k.coaches.map(id => badge(multi ? `Waiting for Coach ${esc(coachById(id).first)}` : 'Waiting for approval', 'warning', 'clock')).join('')}</span>`)).join('')}</div>
    <p class="fine">Booking with ${multi ? 'each coach opens as soon as they approve' : `${who} opens as soon as they approve`}. Check back here.</p>
    ${B('Go to my account', 'primary', 'acSuToHome', { block: true, lg: true })}`),
    help('While you wait', 'Your account shows your profile and your skaters. You can’t see your coach’s times until a skater is approved.'),
    { steps: 4, ctx: 'Family sign up', right: '' });
};

/* ================= Home ================= */
/** One card per coach (owner, 2026-10-13). A coach who hasn't approved any of the family's skaters shows no contact
    details or payment handles: a waiting family reads nothing of that coach (ADR-022 d6, ADR-025 d3). */
const acCoachCard = cid => {
  const p = coachById(cid), lines = [], kids = myKids().filter(k => linkOf(k, cid)), ok = kids.some(k => linkOf(k, cid) === 'ACTIVE');
  if (ok && p.showPhone && p.phone) lines.push(`<span>${ic('phone', 14)}${esc(p.phone)}</span>`);
  if (ok && p.showEmail && p.businessEmail) lines.push(`<span>${ic('mail', 14)}${esc(p.businessEmail)}</span>`);
  if (ok) lines.push(...payShown(p).map(([k, v]) => `<span>${ic('card', 14)}${k}${v ? ' ' + esc(v) : ''}</span>`));   // one switch per type (ADR-016 d7)
  const multi = multiCoach();
  return card(`<div class="found found--plain">${avatar(initials(cName(p)), '')}<div><div class="found__name">Coach ${esc(cName(p))}</div>${multi ? `<div class="found__sub">${kids.map(k => esc(firstName(k.name))).join(', ')}</div>` : ''}</div>${multi && !ok ? badge('Waiting', 'warning', 'clock') : ''}</div>
    ${!ok ? `<p class="fine">Waiting for Coach ${esc(p.first)} to approve ${kids.map(k => esc(firstName(k.name))).join(' and ')}. Contact details and booking show once they do.</p>`
      : lines.length ? `<div class="ac-contact">${lines.join('')}</div>` : `<p class="fine">Reply to any lesson email to reach Coach ${esc(p.first)}.</p>`}`, { title: multi ? '' : 'Your coach', cls: 'ac-coachcard' });
};
const acCoachCards = () => `${multiCoach() ? `<div class="ac-cardshead">Your coaches</div>` : ''}${myCoachIds().map(acCoachCard).join('')}`;
const acLessonRow = l => row(`<span class="ac-when num"><b>${fmtShortT(l.t)}</b><small>${l.iso === TODAY ? 'Today' : dDow(l.iso)}</small></span>${avatar(initials(nameOf(l)), 'sm')}${rowTitle(esc(nameOf(l)), `${coachTag(l).replace(/^ · /, '')}${coachTag(l) ? ' · ' : ''}${l.len} min · ${money(l.price)}${bkRepeatsLabel(l) ? ' · ' + bkRepeatsLabel(l) : ''}${l.with ? ' · shared' : l.invited ? ' · invited to share' : ''}`)}`,
  isStarted(l) ? statusBadge(l) : badge('Booked', 'primary'));

/** Invitations for this family's skaters that are still open, to answer. */
const acInviteCard = () => {
  const open = invsToMe().filter(i => i.status === 'SENT');
  if (!open.length) return '';
  return card(open.map(i => { const k = student(i.skater), host = student(i.fromSkater);
    return row(`<span class="roundicon">${ic('users', 18)}</span>${rowTitle(`${esc(i.from)} invited ${esc(firstName(k.name))} to share a lesson with Coach ${esc(cName(invCoach(i)))}`, `${invWhen(i)}${i.series ? ` · ${invDates(i)}` : ''} · with ${esc(shortName(host.name))}`)}`,
      invLink(i.id, 'See the invitation')); }).join(''),
    { title: 'Shared lesson invitations', sub: 'Another family invited your skater to share their lesson.', pad: false, cls: 'card--attn' });
};

/* Per-coach wording (owner, 2026-10-13): every coach a skater is waiting for is named, never only Coach Dana. */
function acHomePending() {
  const kids = myKids(), waits = waitingByCoach(), multi = waits.length > 1;
  const names = list => list.length === 1 ? esc(firstName(list[0].name)) : list.map(k => esc(firstName(k.name))).join(' and ');
  const coaches = coachOr(waits.map(w => w.cid), 'and');
  const lead = waits.length ? (multi ? `Waiting for ${coaches} to approve your skaters` : `Waiting for Coach ${esc(waits[0].c.first)} to approve ${waits[0].kids.length === kids.length && kids.length > 1 ? 'your skaters' : names(waits[0].kids)}`) : '';
  return shell(`
    ${pageHead(`Welcome, ${esc(firstName(state.me.name))}`, `You’re signed up with ${coachOr(myCoachIds(), 'and')}.`)}
    ${waits.length ? `<div class="alertcard ac-wait"><div class="alertcard__head">${ic('clock', 20)}<div><div class="alertcard__title">${lead}</div><div class="alertcard__body">${multi ? 'Until a coach approves, you won’t see their times and can’t book with them.' : `Until then you won’t see Coach ${esc(waits[0].c.first)}’s times and can’t book.`} Each coach checks that they know each family who signs up with their code.</div></div></div>${multi ? `<div class="listbox ac-waitlist">${waits.map(w => row(`${avatar(initials(cName(w.c)), 'sm')}${rowTitle(`Coach ${esc(cName(w.c))}`, `Waiting to approve ${names(w.kids)}`)}`, badge('Waiting', 'warning', 'clock'))).join('')}</div>` : ''}</div>` : ''}
    ${card(kids.map(k => row(`${avatar(initials(k.name), 'sm')}${rowTitle(esc(k.name), `${k.minor ? 'Under 18' : 'Adult'} · signed up ${dShort(k.since)}`)}`, `<span class="ac-kc__list">${acKidCoaches(k).map(id => badge(multiCoach() ? `Waiting for Coach ${esc(coachById(id).first)}` : 'Waiting for approval', 'warning', 'clock')).join('') || NO_COACH_BADGE()}</span>`)).join(''),
      { title: 'Your skaters', pad: false, action: A_('profile', 'Profile') })}
    ${card(`<ol class="ac-steps"><li><b>${multi ? 'Each coach approves' : `Coach ${esc((waits[0] || { c: coachById(DANA) }).c.first)} approves`} each skater.</b> Usually within a day.</li><li><b>Booking opens${multi ? ' with each coach as they approve' : ''}.</b> You’ll see open times and can book single or weekly lessons.</li></ol>`, { title: 'What happens next' })}`);
}

SCREENS.home = () => {
  if (isPendingFamily()) return acHomePending();
  const mine = myLessons(), today = mine.filter(l => l.iso === TODAY);
  const next = mine.filter(l => !isStarted(l)).slice(0, 4);
  const waits = waitingByCoach();
  return shell(`
    ${pageHead(`Good morning, ${esc(firstName(state.me.name))}`, dLong(TODAY), B('Book a lesson', 'primary', '', { href: href('book'), icon: 'calendar' }))}
    ${bkAskFullCards()}
    ${waits.map(w => banner('warning', `${w.kids.map(k => esc(firstName(k.name))).join(' and ')} ${w.kids.length === 1 ? 'is' : 'are'} waiting for Coach ${esc(w.c.first)}’s approval`, `You can book with Coach ${esc(w.c.first)} once they approve.`)).join('')}
    ${acInviteCard()}
    <div class="split split--today">
      <div class="stack">
        ${card(today.length ? today.map(acLessonRow).join('') : `<div class="pempty"><span class="pempty__icon">${ic('calendar', 22)}</span><b>No lessons today</b><span class="muted">${next[0] ? `Next: ${esc(firstName(nameOf(next[0])))}, ${dDow(next[0].iso)} at ${fmtT(next[0].t)}` : 'Nothing booked yet.'}</span></div>`,
          { title: 'Today', sub: dLong(TODAY), pad: false })}
        ${card(next.length ? next.map(acLessonRow).join('') : `<div class="pempty"><b>Nothing booked</b><span class="muted">${A_('book', 'Book a lesson')}</span></div>`,
          { title: 'Coming up', pad: false, action: A_('bookings', 'All bookings') })}
      </div>
      <div class="stack">
        ${acCoachCards()}
        ${card(`<div class="quick">
          ${[['Book a lesson', 'calendar', href('book')], ['My bookings', 'list', href('bookings')], ['Profile', 'user', href('profile')], ['Payments', 'card', href('payments')]]
            .map(([t, i, h]) => `<a class="quick__item" href="${h}"><span class="quick__icon">${ic(i, 18)}</span><span>${t}</span>${t === 'Payments' ? '<small>Phase 2</small>' : ''}</a>`).join('')}
        </div>`, { title: 'Go to' })}
      </div>
    </div>`, { width: 'wide' });

/* ================= Profile ================= */
/* Many coaches (ADR-025 d2, d7). Your coaches lists every coach a skater is with or waiting for. Add a coach: enter that
   coach's code, see who it is, and choose which skaters join; each new link waits for that coach alone. "Coach Sam will see
   that Mia also skates with Coach Dana" is Phase 2 with d4, so it isn't shown. */
/** Code check for adding a coach: the family's own coaches, plus the demo directory. */
function acCoachLookup(code) {
  const raw = String(code || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
  if (raw.length < 8) return { st: 'typing' };
  const c = [coachById(DANA), ...Object.values(state.coaches), ...COACH_DIRECTORY].find(c => c.code.replace(/[^A-Z0-9]/g, '') === raw);
  return c ? { st: 'found', c } : { st: acLooksLikeShare(code) ? 'share' : 'wrong' };
}
const acKidCoaches = k => [DANA, ...Object.keys(state.coaches)].filter(cid => linkOf(k, cid));
/** One badge per coach the skater is with: approved, or waiting for that coach. */
/* A skater added on the profile can start with no coach (ADR-025 item k, amended 2026-11-06): a SKATER# item and a share
   code, no link and no STUDENT# record. They can't be booked, invited or added as a sibling until Add a coach. */
const NO_COACH_BADGE = () => badge('Not with a coach yet', 'neutral', 'info');
const acCoachBadges = k => !acKidCoaches(k).length ? NO_COACH_BADGE() : acKidCoaches(k).map(cid => linkOf(k, cid) === 'ACTIVE' ? badge(`Coach ${esc(coachById(cid).first)}`, 'success', 'check') : badge(`Waiting for Coach ${esc(coachById(cid).first)}`, 'warning', 'clock')).join('');
function acCoachesCard() {
  const u = acUi(), kids = myKids(), ids = myCoachIds();
  const crow = cid => { const c = coachById(cid), with_ = kids.filter(k => linkOf(k, cid)), ok = with_.some(k => linkOf(k, cid) === 'ACTIVE');
    return row(`${avatar(initials(cName(c)), 'sm')}${rowTitle(`Coach ${esc(cName(c))}`, `${with_.map(k => `${esc(firstName(k.name))}${linkOf(k, cid) === 'PENDING' ? ' (waiting)' : ''}`).join(', ')}`)}`,
      ok ? badge('Approved', 'success', 'check') : badge('Waiting for approval', 'warning', 'clock')); };
  let add = `<button type="button" class="addrow" data-act="acCoachStart">${ic('plus', 16)}Add a coach</button>`;
  if (u.coachAdding) {
    const lk = acCoachLookup(u.coachCode), c = lk.c, picked = kids.filter(k => u.coachKids.includes(k.id) && !(c && linkOf(k, c.id)));
    add = `<div class="ac-add">
      ${INP('ac-coach-code', 'Coach code', 'ui.ac.coachCode', { live: true, mono: true, placeholder: 'e.g. K7QM-4X9T', error: lk.st === 'wrong' ? 'That code doesn’t match a coach. Check it with the coach who gave it to you. Codes are 8 letters and numbers.' : lk.st === 'share' ? SHARE_IN_COACH_BOX : '', hint: lk.st === 'typing' ? 'Every coach has their own code. Ask the new coach for theirs.' : '' })}
      ${c ? `<div class="found">${avatar(initials(cName(c)))}<div><div class="found__name">Coach ${esc(cName(c))}</div></div>${badge('Code found', 'success', 'check')}</div>
        <div class="fieldset"><div class="label">Who will skate with Coach ${esc(c.first)}?</div>
          <div class="ac-coachkids">${kids.map(k => { const st = linkOf(k, c.id);
            return st ? `<div class="check ac-check--done"><span class="check__text"><span class="check__label">${esc(k.name)}</span><span class="check__sub">${st === 'ACTIVE' ? `Already Coach ${esc(c.first)}’s student` : `Already waiting for Coach ${esc(c.first)}`}</span></span>${badge(st === 'ACTIVE' ? 'Approved' : 'Waiting', st === 'ACTIVE' ? 'success' : 'warning')}</div>`
              : CHK(esc(k.name), u.coachKids.includes(k.id), 'acCoachKid', [k.id], acKidCoaches(k).length ? `Also with ${acKidCoaches(k).map(id => `Coach ${esc(coachById(id).first)}`).join(', ')}` : ''); }).join('')}</div>
          <div class="hint">Skater not listed? Add them under Skaters and choose “None of my coaches yet”. They’ll then appear here.</div></div>
        ${banner('info', `Coach ${esc(c.first)} approves each skater`, `You can book with Coach ${esc(c.first)} once they do. Your other coaches aren’t affected.`)}` : ''}
      <div class="skater__actions">${B('Cancel', 'ghost', 'acCoachCancel', { sm: true })}${B(c ? `Send to Coach ${esc(c.first)}` : 'Send', 'secondary', 'acCoachSend', { sm: true, icon: 'arrowR', disabled: !c || !picked.length })}</div></div>`;
  }
  return card(`${ids.map(crow).join('') || `<div class="row"><span class="muted">No coaches yet.</span></div>`}${add}`,
    { title: 'Your coaches', sub: 'Each coach approves your skaters and sets their own times and prices.', pad: false });
}
SCREENS.profile = () => {
  const u = acUi(), kids = myKids(), self = state.me.rel === 'Self', multi = multiCoach();
  const status = k => multi ? '' : !acKidCoaches(k).length ? NO_COACH_BADGE() : k.status === 'ACTIVE' ? badge('Approved', 'success', 'check') : k.status === 'PENDING' ? badge('Waiting for approval', 'warning', 'clock') : badge('Not Coach ' + esc(coachFirst()) + '’s student yet', 'neutral');
  const skaterRow = k => row(`${avatar(initials(k.name), 'sm')}${rowTitle(esc(k.name), `${k.minor ? 'Under 18' : 'Adult'}${k.orgNum ? ` · ${orgLine({ org: k.org, num: k.orgNum })}` : ''}`)}`,
    status(k))
    + (multi ? `<div class="ac-code ac-kc"><span class="ac-code__label">Coaches</span><span class="ac-kc__list">${acCoachBadges(k) || '<span class="muted">None yet</span>'}</span></div>` : '')
    + (k.shareCode ? `<div class="ac-code"><span class="ac-code__label">Share code</span><span class="mono ac-code__v">${esc(k.shareCode)}</span><span class="ac-code__btns">${B('Copy', 'ghost', 'acCopyCode', { sm: true, icon: 'copy', args: [k.id] })}</span></div>` : '');
  return shell(`
    ${pageHead('Profile', multi ? 'How your coaches and BladeBook reach you.' : 'How Coach ' + esc(coachFirst()) + ' and BladeBook reach you.')}
    ${card(`
      ${INP('ac-pr-name', self ? 'Your name' : `Your name (${state.me.rel.toLowerCase()})`, 'me.name')}
      <div class="grid2">${INP('ac-pr-phone', 'Mobile phone', 'me.phone', { type: 'tel' })}${INP('ac-pr-email', 'Email', 'me.email', { type: 'email', hint: 'You log in with this. Changing it sends a code to the new address.' })}</div>
      ${smsLater()}
      <div class="fieldset"><div class="label">Profile picture ${badge('Phase 2', 'neutral')}</div><div class="photo-pick">${avatar(initials(state.me.name), 'lg')}${B('Choose a picture', 'secondary', '', { sm: true, disabled: true })}<span class="hint">Picking a picture comes in Phase 2.</span></div></div>`,
      { title: 'Your details' })}
    ${card(`${kids.map(skaterRow).join('') || `<div class="row"><span class="muted">No skaters.</span></div>`}
      ${kids.length ? `<div class="card__note">${ic('users', 14)} To share a lesson, give a skater’s share code to the other family. They enter it when they book.</div>` : ''}
      ${self ? `<div class="card__note">${ic('info', 14)} You skate yourself. To book for a child, they need their own family account.</div>`
        : u.adding ? `<div class="ac-add">
          ${INP('ac-new-name', 'Skater’s full name', 'ui.ac.newName', { placeholder: 'e.g. Lily Chen', hint: 'Children under 18. A skater 18 or older signs up for their own account.' })}
          ${skaterOrgFields('ui.ac', 'newOrg', 'newNum', 'ac-new-num', 'acNewOrg')}
          <div class="fieldset"><div class="label">Which coaches?</div><div class="ac-coachkids">${myCoachIds().map(id => { const c = coachById(id); return CHK(`Coach ${esc(cName(c))}`, u.newCoaches.includes(id), 'acNewCoach', [id]); }).join('')}
            ${CHK('None of my coaches yet', !!u.newNone, 'acNewNone', [], 'For a skater who’ll start with a new coach. Use Add a coach when you have their code.')}</div>
            <div class="hint">Pick each coach the new skater will take lessons with, or none yet. You can add more later.</div></div>
          ${u.newNone ? banner('info', 'Not with a coach yet', 'You can’t book for them, or add them to a shared lesson, until a coach approves them. No coach is told about them until you add one.')
            : u.newCoaches.length > 1 ? banner('info', 'Each coach you pick approves the new skater', 'You can book with a coach once they approve.')
            : banner('info', `${u.newCoaches.length ? `Coach ${esc(coachById(u.newCoaches[0]).first)}` : 'The coach you pick'} approves new skaters`, 'You can book for them once they’re approved.')}
          <div class="skater__actions">${B('Cancel', 'ghost', 'acAddCancel', { sm: true })}${B('Add skater', 'secondary', 'acAddSkater', { sm: true, icon: 'plus', disabled: !u.newName.trim() || !acNumOk(u.newOrg, u.newNum) || !(u.newNone || u.newCoaches.length) })}</div></div>`
        : `<button type="button" class="addrow" data-act="acAddStart">${ic('plus', 16)}Add a skater</button>`}`,
      { title: 'Skaters', sub: multi || kids.some(k => !acKidCoaches(k).length) ? 'Everyone in your family who skates, and the coaches they’re with.' : `Everyone who takes lessons with Coach ${esc(coachFirst())}.`, pad: false })}
    ${acCoachesCard()}
    <div class="actions"><div></div><div class="actions__r">${B('Log out', 'ghost', 'acLogout')}${B('Save', 'primary', 'acSave')}</div></div>`);
};

/* ================= Shared-lesson invitation (ADR-026 d5 steps 3–4, ADR-033) =================
   Opened from the invitation email. It's inside the signed-in shell: opening the link does nothing on its own, and signing
   in proves it's Family B. Shows who invited, the lesson or series, which skater, and clashes with that skater's other
   lessons (ADR-025 d5); Family B goes ahead or declines. Only a skater the coach has already accepted can be invited
   (ADR-033 d1), so going ahead books the seat straight away. The lesson's price is split between the two skaters
   (owner, 2026-10-13; ADR-026 P2). */
const invUi = () => (state.ui.inv ??= { id: null });
const invCur = () => { const mine = invsToMe(); return mine.find(i => i.id === invUi().id) || mine.find(i => i.status === 'SENT') || mine[0]; };
/** How many skaters split the lesson once the invited skater joins: the booking's skater, anyone already joined, and
    the invited skater (ADR-MASTER "Price shares"; owner, 2026-11-11, B10). */
const invSkaters = (l, inv) => 2 + (l.with || []).filter(w => w.sid !== inv.skater).length;
SCREENS.invite = () => {
  const inv = invCur();
  if (!inv) return shell(card(`<div class="pempty"><span class="pempty__icon">${ic('users', 22)}</span><b>No invitations</b><span class="muted">Nothing to answer right now.</span>${B('Back to home', 'secondary', '', { href: href('home') })}</div>`));
  const ic_ = invCoach(inv), kid = student(inv.skater), kf = esc(firstName(kid.name)), host = esc(shortName(student(inv.fromSkater).name)), coach = esc(ic_.first);
  const ls = invLessons(inv);
  const details = card(`
    ${kv('Invited by', `${esc(inv.from)}, for ${host}`)}
    ${kv('Lesson', inv.series ? `${DOW_LONG[inv.dow]}s at ${fmtT(inv.t)} · ${inv.len} min` : `${dLong(inv.iso)} at ${fmtT(inv.t)} · ${inv.len} min`)}
    ${inv.series ? kv('Dates', invDates(inv)) : ''}
    ${kv('Coach', `Coach ${esc(cName(ic_))} · ${RINK_SHORT}`)}
    ${kv('Skater', esc(kid.name))}
    ${(() => { const l0 = ls[0], full = l0 ? (l0.full ?? l0.price) : 0; return kv('Price', full ? `${money(shareOf(full, invSkaters(l0, inv), invSkaters(l0, inv) - 1))} for ${kf}${inv.series ? ' per lesson' : ''}: the lesson’s ${money(full)}, split between ${invSkaters(l0, inv)} skaters. You pay Coach ${coach} directly.` : `You pay Coach ${coach} directly.`); })()}`, { title: inv.series ? 'The lessons' : 'The lesson' });
  const aside = `<div class="stack">${help('Shared lessons', `Two skaters share one lesson with Coach ${coach}. Each skater’s attendance and payment are kept separately.`)}${inv.series ? help('A repeating lesson', `Going ahead joins ${kf} to every lesson in the series.`) : ''}</div>`;
  const page = (top, body = '') => shell(`${top}<div class="split split--today"><div class="stack">${details}${body}</div>${aside}</div>`, { width: 'wide' });
  const hero = (cls, icon, title, sub) => `<div class="crumb">${crumb('home', 'Home')}</div><div class="hero ${cls}"><span class="hero__icon">${ic(icon, 26)}</span><div><h1 class="h1">${title}</h1><p class="lede">${sub}</p></div></div>`;
  // After answering, the same link shows where the invitation stands.
  if (inv.status === 'CONFIRMED') return page(hero('hero--success', 'check', `${kf} has joined ${host}’s ${inv.series ? 'lessons' : 'lesson'}`, `${inv.series ? `Every lesson in the series is` : 'It’s'} in ${isPendingFamily() ? 'your account' : A_('bookings', 'My bookings')}. Coach ${coach} sees both skaters.`));
  if (inv.status === 'DECLINED') return page(hero('bk-hero--warn', 'x', 'Invitation declined', `We’ve told ${esc(inv.from)}. Nothing was booked for ${kf}.`));
  if (inv.status === 'WITHDRAWN') return page(hero('bk-hero--warn', 'x', `${esc(inv.from)} withdrew this invitation`, `Nothing was booked for ${kf}.`));
  if (inv.status === 'EXPIRED') return page(hero('bk-hero--warn', 'clock', 'This lesson is no longer available', `It wasn’t answered before it started, so ${kf} wasn’t added.`));
  const clashes = inv.clashes || [];
  return page(pageHead(`${esc(inv.from)} invited ${kf} to share a lesson`, `${host} and ${kf}, together with Coach ${esc(cName(ic_))}${inv.series ? `, ${invWhen(inv)}` : ` on ${invWhen(inv)}`}.`, '', crumb('home', 'Home'))
, `
    ${card(clashes.length ? `${banner('warning', `${plural(clashes.length, 'clash', 'clashes')} with ${kf}’s other lessons`, `${kf} can’t be in two places at once. You can still go ahead and sort out the other lesson.`)}
      <div class="listbox">${clashes.map(c => row(`<span class="roundicon roundicon--warn">${ic('alert', 16)}</span>${rowTitle(esc(c.when), esc(c.what))}`)).join('')}</div>`
      : row(`<span class="roundicon roundicon--ok">${ic('check', 16)}</span>${rowTitle('No clashes', `Nothing else is booked for ${kf} at ${inv.series ? 'these times' : 'that time'}.`)}`), { title: 'Clashes', sub: `Checked against ${kf}’s other lessons, with any coach.` })}
    <div class="actions"><div>${B('Decline', 'secondary', 'invDecline')}</div><div class="actions__r">${B('Go ahead', 'primary', 'invGo', { lg: true, iconR: 'arrowR' })}</div></div>
    <p class="fine">Going ahead adds ${kf} to ${inv.series ? `all ${plural(ls.length, 'lesson')}` : 'the lesson'} now.</p>`);
};

/* ================= Payments (Phase 2) ================= */
SCREENS.payments = () => {
  const p = state.profile, unpaid = myLessons().filter(l => isPast(l) && l.pay === 'UNPAID');
  const total = unpaid.reduce((s, l) => s + l.price, 0);
  const handles = payShown(p);
  return shell(`
    ${pageHead('Payments', 'Lessons Coach ' + esc(coachFirst()) + ' hasn’t marked paid yet.', badge('Phase 2', 'neutral'), crumb('home', 'Home'))}
    ${banner('info', 'Coming in Phase 2', 'This page isn’t in the first release. BladeBook doesn’t take payments: you pay Coach ' + esc(coachFirst()) + ' directly, and they mark the lesson paid.')}
    <div class="stats">${stat('Not marked paid', money(total), plural(unpaid.length, 'lesson'), 'card')}${stat('Skaters', String(myActiveKids().length), myActiveKids().map(k => esc(firstName(k.name))).join(' & '), 'users')}${stat('Notice period', `${p.notice} hours`, 'Late cancels may be charged', 'clock')}</div>
    ${card(unpaid.length ? `<div class="ac-tablewrap"><table class="table"><thead><tr><th>Skater</th><th>Lesson</th><th>Attendance</th><th class="r">Amount</th></tr></thead><tbody>${unpaid.map(l => `<tr><td><span class="cellname">${avatar(initials(nameOf(l)), 'sm')}${esc(nameOf(l))}</span></td><td>${dDow(l.iso)} · ${fmtT(l.t)}</td><td>${statusBadge(l)}</td><td class="r money">${money(l.price)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="pempty"><span class="pempty__icon">${ic('check', 22)}</span><b>All paid</b><span class="muted">Nothing is waiting to be marked paid.</span></div>`, { title: 'Not marked paid', pad: false })}
    ${card(`<p class="ac-instr">${esc(p.instructions)}</p>${handles.length ? `<div class="ac-contact">${handles.map(([k, v]) => `<span>${ic('card', 14)}${k}${v ? ' ' + esc(v) : ''}</span>`).join('')}</div>` : ''}`, { title: `How to pay Coach ${esc(coachFirst())}` })}`, { width: 'wide' });
};

/* ================= actions ================= */
Object.assign(ACTIONS, {
  acLogin() { state.auth.notice = ''; state.authed = true; go('home'); },
  acLogout() { state.authed = false; state.auth = { email: state.me.email }; go('login'); },
  acForgotSend() { acUi().fp = 1; state.screen = 'forgot'; },
  acForgotDone() { acUi().fp = 0; state.auth.notice = 'Password changed. Log in with your new password.'; go('login'); },
  acSuNext() {
    const u = suUi();
    if (u.step === 0) { if (acCodeState(u.code, u.coaches) === 'found') ACTIONS.acSuAddCoach(); if (!u.coaches.length) return; }
    u.step = Math.min(4, u.step + 1);
  },
  /** Keep the coach whose code is in the box, and clear it for the next code. */
  acSuAddCoach() { const u = suUi(), c = findCoach(u.code); if (!c || u.coaches.includes(c.id)) return; u.coaches.push(c.id); u.code = ''; u.draftCoaches = null; u.selfCoaches = null; },
  acSuDropCoach(i) { const u = suUi(); u.coaches.splice(i, 1); u.draftCoaches = null; u.selfCoaches = null; },
  acSuDraftCoach(id) { const u = suUi(), on = suSel(u, 'draftCoaches'); u.draftCoaches = on.includes(id) ? on.filter(x => x !== id) : [...on, id]; },
  acSuSelfCoach(id) { const u = suUi(), on = suSel(u, 'selfCoaches'); u.selfCoaches = on.includes(id) ? on.filter(x => x !== id) : [...on, id]; },
  acSuBack() { const u = suUi(); u.step = Math.max(0, u.step - 1); },
  acSuFor(i) { suUi().forWho = i; },
  acSuChangeWho() { const u = suUi(); u.forWho = 1; u.step = 1; },
  acSuSms() { const u = suUi(); u.sms = !u.sms; },
  acSuDraftMinor(i) { suUi().draftMinor = i; },
  acSuDraftOrg(i) { suUi().draftOrg = i; },
  acSuSelfOrg(i) { suUi().selfOrg = i; },
  /** A real confirmation: unticked to start, and Send stays off until it's ticked (owner, 2026-11-09). */
  acSuSelfAdult() { const u = suUi(); u.selfAdult = !u.selfAdult; },
  acSuAddSkater() { const u = suUi(); const n = u.draft.trim(), num = acCleanNum(u.draftNum), cs = suSel(u, 'draftCoaches'); if (!n || !acNumOk(u.draftOrg, num) || !cs.length) return; u.skaters.push({ name: n, minor: true, org: u.draftOrg, num, coaches: cs }); u.draft = ''; u.draftNum = ''; u.draftCoaches = null; },
  acSuDropSkater(i) { suUi().skaters.splice(i, 1); },
  acSuFinish() {
    const u = suUi(), self = u.forWho === 0, name = `${u.first} ${u.last}`.trim();
    const rel = ['Self', 'Guardian'][u.forWho];
    const kids = (self ? [{ name, minor: false, org: u.selfOrg, num: acCleanNum(u.selfNum), coaches: suSel(u, 'selfCoaches') }] : u.skaters).map(k => ({ ...k, coaches: (k.coaches || suCids(u)).filter(id => suCids(u).includes(id)) }));
    if (!kids.length || kids.some(k => !acNumOk(k.org, k.num) || !k.coaches.length)) return;
    // The new family exists only in this demo session: each skater is PENDING with each coach they chose (ADR-025 d2).
    state.students = state.students.filter(s => s.client !== name);
    for (const id of suCids(u)) if (id !== DANA && !state.coaches[id]) state.coaches[id] = { ...coachById(id) };
    kids.forEach((k, i) => state.students.push({ id: `n${Date.now() % 100000}${i}`, name: k.name, minor: k.minor, org: k.org, orgNum: k.num, rel, client: name, email: u.email, phone: u.phone, sms: u.sms,
      status: k.coaches.includes(DANA) ? 'PENDING' : 'NONE', links: Object.fromEntries(k.coaches.filter(id => id !== DANA).map(id => [id, 'PENDING'])), since: TODAY, shareCode: acShareCode(k.name, i) }));
    state.me = { name, rel, email: u.email, phone: u.phone, sms: u.sms };
    u.done = kids.map(k => ({ name: k.name, coaches: k.coaches })); u.step = 4;
  },
  acSuToHome() { state.authed = true; state.ui.su = null; go('home'); },
  acSms() { state.me.sms = !state.me.sms; },
  acSave() { for (const s of myKids()) Object.assign(s, { client: state.me.name, email: state.me.email, phone: state.me.phone, sms: state.me.sms }); state.flash = 'Saved.'; },
  acAddStart() { Object.assign(acUi(), { adding: true, newCoaches: [], newNone: false }); },
  acAddCancel() { Object.assign(acUi(), { adding: false, newName: '', newNum: '', newCoaches: [], newNone: false }); },
  acNewMinor(i) { acUi().newMinor = i; },
  acNewOrg(i) { acUi().newOrg = i; },
  /** Picking a coach clears "None of my coaches yet", and the other way round. */
  acNewCoach(id) { const u = acUi(); u.newNone = false; u.newCoaches = u.newCoaches.includes(id) ? u.newCoaches.filter(x => x !== id) : [...u.newCoaches, id]; },
  acNewNone() { const u = acUi(); u.newNone = !u.newNone; if (u.newNone) u.newCoaches = []; },
  /** A new skater waits for each coach the family picked, or, with "None of my coaches yet", has no link at all
      (ADR-025 item k, amended 2026-11-06): only the SKATER# item and a share code. */
  acAddSkater() {
    const u = acUi(), n = u.newName.trim(), num = acCleanNum(u.newNum), cs = u.newNone ? [] : u.newCoaches;
    if (!n || !acNumOk(u.newOrg, num) || !(u.newNone || cs.length)) return;
    state.students.push({ id: `n${Date.now() % 100000}`, name: n, minor: true, org: u.newOrg, orgNum: num, rel: state.me.rel, client: state.me.name, email: state.me.email, phone: state.me.phone, sms: state.me.sms,
      status: cs.includes(DANA) ? 'PENDING' : 'NONE', links: Object.fromEntries(cs.filter(id => id !== DANA).map(id => [id, 'PENDING'])), since: TODAY, shareCode: acShareCode(n, TODAY) });
    Object.assign(u, { adding: false, newName: '', newNum: '', newCoaches: [], newNone: false });
    state.flash = cs.length ? `${n} added. ${coachOr(cs, 'and')} will approve them before you can book with ${cs.length > 1 ? 'them' : 'that coach'}.`
      : `${n} added. They’re not with a coach yet. When you have the coach’s code, use Add a coach.`;
  },
  acCoachStart() { Object.assign(acUi(), { coachAdding: true, coachCode: '', coachKids: [] }); },
  acCoachCancel() { Object.assign(acUi(), { coachAdding: false, coachCode: '', coachKids: [] }); },
  acCoachKid(id) { const u = acUi(); u.coachKids = u.coachKids.includes(id) ? u.coachKids.filter(x => x !== id) : [...u.coachKids, id]; },
  /** Each chosen skater gets a PENDING link with the new coach, approved by that coach alone (ADR-025 d2). */
  acCoachSend() {
    const u = acUi(), lk = acCoachLookup(u.coachCode); if (lk.st !== 'found') return;
    const c = lk.c, kids = myKids().filter(k => u.coachKids.includes(k.id) && !linkOf(k, c.id)); if (!kids.length) return;
    if (c.id !== DANA && !state.coaches[c.id]) state.coaches[c.id] = { ...c };
    for (const k of kids) { if (c.id === DANA) Object.assign(k, { status: 'PENDING', since: TODAY }); else (k.links ??= {})[c.id] = 'PENDING'; }
    Object.assign(u, { coachAdding: false, coachCode: '', coachKids: [] });
    state.flash = `Sent to Coach ${cName(c)}. ${kids.map(k => firstName(k.name)).join(' and ')} can book with Coach ${c.first} once they approve.`;
  },
  acCopyCode(id) { const c = student(id).shareCode; try { navigator.clipboard.writeText(c); } catch (e) { /* static build: no clipboard */ } state.flash = `Copied ${c}.`; },
  invOpen(id) { invUi().id = id; go('invite'); },
  /** Go ahead: the invited seat goes INVITED → BOOKED on every lesson that hasn't started (ADR-033 d3). Only a skater
      ACTIVE with the coach can be invited, so there's nothing to wait for. */
  invGo() {
    const inv = invCur(), kid = student(inv.skater), ls = invLessons(inv).filter(l => !isStarted(l));
    for (const l of ls) { l.with = [...(l.with || []), { sid: kid.id, status: 'BOOKED', pay: 'UNPAID', paidBy: null, price: null }]; splitPrice(l); delete l.invited; }
    inv.status = 'CONFIRMED'; inv.confirmed = TODAY;
    state._scrollTop = true;
  },
  invDecline() { invCur().status = 'DECLINED'; state._scrollTop = true; },
});

/* Client website — booking and My bookings.
   FeatureDecriptions/Bookings: and cancelation.md; ADR-006 d3, d4, d4a, d4b; ADR-009 d4; ADR-015 d1a; §7 privacy;
   sharing a lesson: ADR-026 d4–d5, ADR-033 (share-check at the share step), FeatureDecriptions/Schedule lesson split.
   Registers SCREENS book / book-times / book-result / bookings / recurrence, MODALS bkConfirm / bkCancel / bkWithdraw,
   ACTIONS bk*, and the 'Book a lesson' and 'My bookings' PRESETS.
   A family sees only open versus taken; who holds a taken time is never shown. Their own lessons show as theirs.
   Many coaches (ADR-025 d3, d5, d7): the page shows one coach at a time, chosen from a Coach dropdown. Switching coach keeps
   the times already picked with other coaches; switching skater clears them. A pick that overlaps the skater's lesson or
   pick with another coach is warned about, never refused. Booking sends one request per coach. */

const BK_MONTHS = ['2026-10', '2026-11', '2026-12'];          // the booking page shows three months (UI limit only)
/** The booking window's last day: the end of the month two months ahead (ADR-031 d3). The day view never leaves
    TODAY..BK_LAST (B5, owner 2026-11-08). */
const BK_LAST = (() => { const [y, m] = BK_MONTHS[BK_MONTHS.length - 1].split('-').map(Number); return toIso(new Date(y, m, 0)); })();
const bkInWindow = iso => iso >= TODAY && iso <= BK_LAST;
const bkClamp = iso => iso < TODAY ? TODAY : iso > BK_LAST ? BK_LAST : iso;
/** One message for every date that couldn't be booked, whatever the cause, so no family learns about another's
    booking (ADR-MASTER "Booking a time"; B1, owner 2026-11-08; wording 2026-11-09). */
const BK_UNAVAILABLE = 'That time was taken or no longer exists.';
const bkUi = () => (state.ui.book ??= { sid: null, coach: null, month: BK_MONTHS[0], day: null, week: false, sel: [], repeat: false, every: 1, until: '', result: null, lastReq: null, noSchedule: false, share: '' });
const bkState = () => (state.ui.bk ??= { arr: {}, rec: null, who: 'all', coach: 'all', all: false, seq: 0 });
/** Skaters who can be booked: approved with at least one coach. */
const bkKids = () => myKids().filter(k => myCoachIds().some(cid => linkOf(k, cid) === 'ACTIVE'));
const bkKid = () => { const u = bkUi(), kids = bkKids(); if (!u.sid || !kids.some(k => k.id === u.sid)) u.sid = kids[0] && kids[0].id; return student(u.sid); };
/** The coach whose times are showing: one the skater is approved with. */
const bkCid = () => { const u = bkUi(), k = bkKid(), ok = myCoachIds().filter(cid => k && linkOf(k, cid) === 'ACTIVE'); if (!ok.includes(u.coach)) u.coach = ok[0] || DANA; return u.coach; };
const bkC = () => coachById(bkCid());
const bkOpen = iso => bkUi().noSchedule ? [] : openSlotsFor(bkCid(), iso);
const bkHasSchedule = iso => !bkUi().noSchedule && slotsFor(bkCid(), iso).length > 0;
const bkMinutesUntil = (iso, t) => Math.round((parseIso(iso) - parseIso(TODAY)) / 864e5) * 1440 + t - NOW_MIN;
/** The coach's notice period. 24 hours for every coach in MVP; per-coach notice periods are Phase 2 (B6, owner 2026-11-08). */
const bkNotice = l => coachById(lcoach(l)).notice || NOTICE_H;
/** After a family cancels: the coach is told only when a lesson was inside the notice period (ADR-009 d9, owner 2026-10-12). */
const bkToldLate = (lessons, coach) => lessons.some(l => bkInsideNotice(l)) ? ` Coach ${coachById(coach).first} has been told, because it’s a late cancellation.` : '';
/** The selected coach's cancellation notice period, shown on both booking pages (owner, 2026-10-13). */
const bkNoticeHelp = c => help(`Cancelling with Coach ${esc(c.first)}`, `Coach ${esc(c.first)} asks for ${c.notice || NOTICE_H} hours’ notice. Cancelling later than that may be charged.`);
const bkInsideNotice = l => { const m = bkMinutesUntil(l.iso, l.t); return m > 0 && m < bkNotice(l) * 60; };
const bkSortT = list => list.slice().sort((a, b) => (a.iso + String(a.t).padStart(4, '0')).localeCompare(b.iso + String(b.t).padStart(4, '0')));
/** Picks grouped by coach, in the family's coach order. */
const bkByCoach = list => myCoachIds().map(cid => ({ cid, c: coachById(cid), ps: bkSortT(list.filter(x => x.coach === cid)) })).filter(g => g.ps.length);

/* ---------- clashes across coaches (ADR-025 d5) ---------- */
const bkOverlap = (a, alen, b, blen) => a < b + blen && b < a + alen;
/** The skater's lesson or pick with another coach that a time overlaps, if any. Warned about, never refused. */
function bkClash(cid, sid, iso, t, len) {
  const l = state.lessons.find(l => l.iso === iso && lcoach(l) !== cid && (l.sid === sid || (l.with || []).some(w => w.sid === sid)) && bkOverlap(t, len, l.t, l.len));
  if (l) return { coach: lcoach(l), t: l.t, len: l.len, booked: true };
  const p = bkUi().sel.find(x => x.iso === iso && x.coach !== cid && bkOverlap(t, len, x.t, x.len));
  return p ? { coach: p.coach, t: p.t, len: p.len, booked: false } : null;
}
const bkClashText = cl => `${cl.booked ? 'Lesson' : 'Your pick'} with Coach ${esc(coachById(cl.coach).first)} at ${fmtT(cl.t)}`;
const bkEveryLabel = n => n === 1 ? 'every week' : `every ${n} weeks`;
/** How often a lesson's series repeats, from the series itself (1 to 4 weeks, ADR-006 d4a; B12, owner 2026-11-09). '' if it doesn't repeat. */
const bkRepeatsLabel = l => { const k = bkKey(l); if (!k) return ''; const n = (bkState().arr[k] || {}).interval || 1; return n === 1 ? 'repeats weekly' : `repeats every ${n} weeks`; };
const bkWeeksBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / (7 * 864e5));
const bkMonthLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MON_LONG[m - 1]} ${y}`; };
const bkShortMonth = ym => MON[Number(ym.split('-')[1]) - 1];

/* Waiting families never see the booking pages (ADR-022 d6). */
const bkPendingGate = () => shell(card(`<div class="pempty"><span class="pempty__icon">${ic('lock', 22)}</span><b>Booking opens once ${coachOr(waitingByCoach().map(w => w.cid).concat(waitingByCoach().length ? [] : [DANA]))} approves</b><span class="muted">Until then you can see your own account and skaters. You can book here as soon as you’re approved.</span>${B('Back to home', 'secondary', '', { href: href('home') })}</div>`));

/* ---------- skater and coach pickers ---------- */
function bkPicker() {
  const kids = bkKids(), k = bkKid();
  const who = kids.length < 2 ? `<div class="picker"><span class="picker__label">Booking for</span><span class="picker__val">${avatar(initials(k.name), 'xs')}${esc(k.name)}</span></div>`
    : `<div class="picker"><span class="picker__label">Booking for</span>${SEG(kids.map(x => esc(firstName(x.name))), kids.findIndex(x => x.id === k.id), 'bkKid')}</div>`;
  return `<div class="bk-pickers">${who}${bkCoachPick(k)}</div>`;
}
/** Coach dropdown: the coaches this skater is with. One still to approve them is listed but can't be picked. */
function bkCoachPick(k) {
  const cid = bkCid(), ids = myCoachIds().filter(id => linkOf(k, id));
  if (ids.length < 2) return '';
  const opts = ids.map(id => { const ok = linkOf(k, id) === 'ACTIVE', n = bkUi().sel.filter(x => x.coach === id).length;
    return `<option value="${id}"${id === cid ? ' selected' : ''}${ok ? '' : ' disabled'}>Coach ${esc(cName(coachById(id)))}${ok ? (n ? ` · ${plural(n, 'pick')}` : '') : ' · waiting to approve'}</option>`; }).join('');
  return `<div class="picker"><label class="picker__label" for="bk-coach">Coach</label><select id="bk-coach" class="ctl bk-coachsel" data-bind="ui.book.coach">${opts}</select></div>`;
}

/* ================= 1 · Pick a day ================= */
SCREENS.book = () => {
  if (isPendingFamily()) return bkPendingGate();
  const u = bkUi(), k = bkKid(), cid = bkCid(), c = bkC(), [y, m] = u.month.split('-').map(Number);
  const first = `${u.month}-01`, days = new Date(y, m, 0).getDate();
  const totalOpen = Array.from({ length: days }, (_, i) => bkOpen(`${u.month}-${String(i + 1).padStart(2, '0')}`).length).reduce((a, b) => a + b, 0);
  const anySchedule = BK_MONTHS.some(ym => { const [yy, mm] = ym.split('-').map(Number); for (let d = 1; d <= new Date(yy, mm, 0).getDate(); d++) if (bkHasSchedule(`${ym}-${String(d).padStart(2, '0')}`)) return true; return false; });
  const mi = BK_MONTHS.indexOf(u.month);
  const cell = d => {
    const iso = `${u.month}-${String(d).padStart(2, '0')}`, n = bkOpen(iso).length;
    const mine = myLessons().filter(l => l.iso === iso && l.sid === k.id && lcoach(l) === cid).length;
    const sp = specialFor(cid, iso), tag = sp && sp.kind === 'timeoff' ? '<span class="bk-calnote">No lessons</span>' : '';
    if (!n) return `<div class="cal__cell cal__cell--off${iso === TODAY ? ' bk-today' : ''}"><span class="cal__num">${d}</span>${mine ? `<span class="bk-calmine">${ic('check', 11)}${esc(firstName(k.name))}</span>` : tag}</div>`;
    return `<button type="button" class="cal__cell cal__cell--open${iso === TODAY ? ' bk-today' : ''}"${actAttr('bkDay', [iso])} aria-label="${dLong(iso)}, ${n} open times"><span class="cal__num">${d}</span><span class="bk-cellfoot">${mine ? `<span class="bk-calmine">${ic('check', 11)}${esc(firstName(k.name))}</span>` : ''}<span class="cal__meta">${n} open</span></span></button>`;
  };
  // Week links on the left, one per calendar row (FeatureDecriptions/Bookings:).
  const firstDow = parseIso(first).getDay(), rows = Math.ceil((firstDow + days) / 7);
  const weeks = Array.from({ length: rows }, (_, r) => {
    const sun = addDays(first, r * 7 - firstDow), sat = addDays(sun, 6);
    let open = 0; for (let i = 0; i < 7; i++) open += bkOpen(addDays(sun, i)).length;
    return open ? `<button type="button" class="bk-week"${actAttr('bkWeek', [sun])}><b>Week ${r + 1}</b><span>${dShort(sun)} – ${dShort(sat)}</span></button>` : `<div class="bk-week bk-week--off"><b>Week ${r + 1}</b><span>Nothing open</span></div>`;
  }).join('');
  const calbar = `<div class="calbar"><button type="button" class="iconbtn" aria-label="Previous month"${mi > 0 ? actAttr('bkMonth', [BK_MONTHS[mi - 1]]) : ' disabled'}>${ic('chevL', 18)}</button><div class="calbar__title">${bkMonthLabel(u.month)}</div><button type="button" class="iconbtn" aria-label="Next month"${mi < BK_MONTHS.length - 1 ? actAttr('bkMonth', [BK_MONTHS[mi + 1]]) : ' disabled'}>${ic('chevR', 18)}</button></div>`;
  if (!anySchedule) return shell(`
    ${pageHead('Book a lesson', `Coach ${esc(cName(c))}`, bkPicker())}
    ${card(`${calbar}<div class="cal-wrap">${monthGrid(y, m - 1, d => `<div class="cal__cell cal__cell--off"><span class="cal__num">${d}</span></div>`, { cls: 'cal--ghost' })}
      <div class="cal-empty"><span class="cal-empty__icon">${ic('calendar', 24)}</span><h2 class="h2">No lesson times yet</h2><p>${esc(c.first)} hasn’t posted any times. Check back soon.</p></div></div>`)}`, { width: 'wide' });
  return shell(`
    ${pageHead('Book a lesson', `Pick a day to see Coach ${esc(c.first)}’s open times for ${esc(firstName(k.name))}.`, bkPicker())}
    ${bkOtherPicks(cid)}
    <div class="split split--cal bk-split">
      ${card(`${calbar}
        <div class="bk-scroll"><div class="bk-calgrid"><div class="bk-weeks"><div class="bk-weeks__h">Jump to</div>${weeks}</div>${monthGrid(y, m - 1, cell)}</div></div>
        <div class="legend"><span class="legend__item"><i class="sw sw--open"></i>Open times</span><span class="legend__item"><i class="sw sw--off"></i>Nothing open</span><span class="legend__item">${ic('check', 12)}${esc(firstName(k.name))} has a lesson</span><span class="legend__note">${plural(totalOpen, 'open time')} in ${MON_LONG[m - 1]}</span></div>`)}
      <div class="stack">
        ${card(`<div class="bk-months">${BK_MONTHS.map(ym => { let n = 0; const [yy, mm] = ym.split('-').map(Number); for (let d = 1; d <= new Date(yy, mm, 0).getDate(); d++) n += bkOpen(`${ym}-${String(d).padStart(2, '0')}`).length; return `<button type="button" class="bk-month${ym === u.month ? ' is-on' : ''}"${actAttr('bkMonth', [ym])}><b>${MON_LONG[mm - 1]}</b><span>${plural(n, 'open time')}</span></button>`; }).join('')}</div>`, { title: 'Months' })}
        ${bkNoticeHelp(c)}
        ${help('Booking window', 'You can see three months ahead. A repeating booking can run past that: you set the end date when you book.')}
        ${myCoachIds().filter(id => linkOf(k, id) === 'ACTIVE').length > 1 ? help('More than one coach', `Pick a coach above to see their times. Times you’ve picked with one coach stay picked when you switch.`) : ''}
      </div>
    </div>`, { width: 'wide' });
};

/* ================= 2 · Pick your times ================= */
function bkSlotState(cid, iso, s, k) {
  const u = bkUi();
  // Every time that has already started says "Past", booked or not (owner, 2026-10-13).
  if (iso < TODAY || (iso === TODAY && s.t <= NOW_MIN)) return { st: 'past' };
  const own = myLessonAt(cid, iso, s.t);
  if (own) return { st: 'yours', who: student(own.sid) };
  if (lessonsFor(cid, iso).some(l => l.t === s.t)) return { st: 'taken' };
  if (u.sel.some(x => x.coach === cid && x.iso === iso && x.t === s.t)) return { st: 'sel' };
  return { st: 'open' };
}
function bkSlot(cid, iso, s, k) {
  const { st, who } = bkSlotState(cid, iso, s, k), end = fmtT(s.t + s.len).replace(' AM', '').replace(' PM', '');
  const price = priceAt(cid, k.id, s), cl = (st === 'open' || st === 'sel') && bkClash(cid, k.id, iso, s.t, s.len);

    ${r.dropped && r.dropped.length ? r.dropped.map(dp => card(`<div class="decide"><div>${rowTitle(`You also have ${DOW_LONG[dp.dow]}s at ${fmtT(dp.t)} booked`, `From your earlier attempt (${plural(dp.count, 'lesson')}). Do you still want them?`)}</div><div class="decide__btns">${B('Cancel them', 'secondary', 'bkDroppedCancel', { args: [dp.key] })}${B('Keep them', 'primary', 'bkDroppedKeep', { args: [dp.key] })}</div></div>`, { cls: 'card--attn' })).join('') : ''}
