# Local development only: DynamoDB Local on localhost:8000 (implementation plan, Batch 1).
# api-coach's local profile refuses any endpoint that isn't localhost.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    user: root
volumes:
  dynamodb-data:
